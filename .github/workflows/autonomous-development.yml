name: CADCraft · Autonomous development guardrails
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'DEVELOPMENT_PLAN.md'
      - '.github/workflows/autonomous-development.yml'
      - 'app/**'
      - 'scripts/**'
concurrency:
  group: autonomous-guardrails-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reusable development instructions
        run: |
          test -s AGENTS.md
          test -s DEVELOPMENT_PLAN.md
          test -s scripts/check-3d-studio.cjs
          test -s app/src/main/assets/3d/index.html
      - name: Check 3D JavaScript and regression suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/3d/index.html').read_text()
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          Path('/tmp/cadcraft-3d.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/cadcraft-3d.js
          node scripts/check-3d-studio.cjs /tmp/cadcraft-3d.js
          node --check app/src/main/assets/bridge/selection.js
          node scripts/check-selection-bridge.cjs app/src/main/assets/bridge/selection.js
          python3 scripts/check-upstream-selection-patch.py
      - name: Describe next step
        run: |
          echo 'Validated. Agent execution is intentionally NOT enabled.'
          echo 'Connect an authorized coding agent separately; require PR review before merge.'

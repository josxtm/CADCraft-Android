name: CADCraft · Verificación continua / APK manual
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'GENERAR APK: activar solo para una versión importante lista para pruebas'
        type: boolean
        required: true
        default: false
      test_objective:
        description: 'Qué funcionalidades se van a probar (referencia de la versión)'
        type: string
        required: true
        default: 'Pruebas de versión importante'
concurrency:
  group: cadcraft-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preflight:
    name: Code verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure test harness and Android sources exist
        run: |
          test -s scripts/check-3d-studio.cjs
          test -s app/src/main/assets/3d/index.html
          test -s app/src/main/java/com/josxtm/cadcraft/MainActivity.java
          test -s app/src/main/assets/bridge/selection.js
          test -s scripts/patch-upstream-selection.py
      - name: Extract 3D script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/3d/index.html').read_text()
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          Path('/tmp/cadcraft-3d.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
      - name: Verify JavaScript and 3D functionality
        run: |
          node --check /tmp/cadcraft-3d.js
          node scripts/check-3d-studio.cjs /tmp/cadcraft-3d.js
          node --check app/src/main/assets/bridge/selection.js
          node scripts/check-selection-bridge.cjs app/src/main/assets/bridge/selection.js
          node --check app/src/main/assets/bridge/files.js
          node scripts/check-file-bridge.cjs
          python3 -m py_compile scripts/patch-upstream-selection.py
          python3 scripts/check-upstream-selection-patch.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust 3D unit tests
        working-directory: native3d
        run: cargo test --all-targets
  android-file-tests:
    name: Android file access regression tests (no APK)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android test build prerequisites
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android and test document picker/save outcomes
        run: gradle --no-daemon --max-workers=4 :app:testDebugUnitTest
  android:
    # Push only runs preflight. A release APK requires an explicit manual opt-in.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Get CADCraft upstream
        run: git clone --depth 1 --branch v0.13.0 https://github.com/storytold/cadcraft.git upstream
      - name: Patch upstream to expose selected entities
        run: python3 scripts/patch-upstream-selection.py
      - name: Compile CADCraft WebAssembly
        working-directory: upstream/apps/cadcraft-web
        run: trunk build --release
      - name: Bundle web into Android
        run: |
          mkdir -p app/src/main/assets/web
          cp -a upstream/dist/web/. app/src/main/assets/web/
          test -f app/src/main/assets/web/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?ANDROID_HOME not set}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-Android-v0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

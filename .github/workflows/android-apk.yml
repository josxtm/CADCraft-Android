name: Build CADCraft Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight:
    name: Code verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure test harness and Android sources exist
        run: |
          test -s scripts/check-3d-studio.cjs
          test -s app/src/main/assets/3d/index.html
          test -s app/src/main/java/com/josxtm/cadcraft/MainActivity.java
      - name: Extract 3D script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/3d/index.html').read_text()
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          Path('/tmp/cadcraft-3d.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
      - name: Verify JavaScript and 3D functionality
        run: |
          node --check /tmp/cadcraft-3d.js
          node scripts/check-3d-studio.cjs /tmp/cadcraft-3d.js
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust 3D unit tests
        working-directory: native3d
        run: cargo test --all-targets
  android:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Get CADCraft upstream
        run: git clone --depth 1 https://github.com/storytold/cadcraft.git upstream
      - name: Compile CADCraft WebAssembly
        working-directory: upstream/apps/cadcraft-web
        run: trunk build --release
      - name: Bundle web into Android
        run: |
          mkdir -p app/src/main/assets/web
          cp -a upstream/dist/web/. app/src/main/assets/web/
          test -f app/src/main/assets/web/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?ANDROID_HOME not set}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-Android-3D-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

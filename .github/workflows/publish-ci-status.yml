name: Publish CI status flag
on:
  workflow_run:
    workflows:
      - "CADCraft · Verificación continua / APK manual"
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact SHA verification result to ci-status branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const branch = 'ci-status';
            const path = 'engine-status.json';
            const head = await github.rest.repos.getBranch({owner, repo, branch:'main'});
            // Never publish an obsolete run as the current verification.
            if (head.data.commit.sha !== sha) {
              core.info('Stale run: main has moved. Skipping status publication.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const preflight = jobs.find(job => job.name === 'Code verification gate');
            if (!preflight || preflight.status !== 'completed') {
              core.setFailed('Preflight job missing or incomplete; refusing green flag');
              return;
            }
            const passed = run.conclusion === 'success' && preflight.conclusion === 'success';
            const report = {
              schema: 1,
              source_sha: sha,
              source_branch: 'main',
              workflow: run.name,
              workflow_run_id: run.id,
              workflow_run_url: run.html_url,
              preflight: preflight.conclusion,
              rust_tests: preflight.conclusion === 'success' ? 'success (included in preflight)' : 'unverified',
              overall: passed ? 'success' : 'failure',
              completed_at: run.updated_at,
              apk_built: false
            };
            const data = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            let previous;
            try {
              previous = await github.rest.repos.getContent({owner, repo, path, ref:branch});
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path, content:data,
              message:'ci: record verification for ' + sha.slice(0, 12),
              ...(previous ? {sha:previous.data.sha} : {})
            });
            core.info('Published ' + report.overall + ' for ' + sha);

name: Issue #2 Rust/egui preview — isolated validation
on:
  push:
    branches:
      - integration/issue-2-preview
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue2-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing source and selection regression checks (unchanged)
        run: |
          set -eux
          python3 -m py_compile scripts/patch-upstream-selection.py scripts/preview-v1/stage.py tests/preview/run.py
          python3 scripts/check-upstream-selection-patch.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/3d/index.html').read_text()
          assert s.count('<script>')==1 and s.count('</script>')==1
          Path('/tmp/cadcraft-3d.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/cadcraft-3d.js
          node scripts/check-3d-studio.cjs /tmp/cadcraft-3d.js
          node scripts/check-selection-bridge.cjs app/src/main/assets/bridge/selection.js
      - name: Clone exact upstream CADCraft v0.13.0
        run: |
          git clone --depth 1 --branch v0.13.0 https://github.com/storytold/cadcraft.git upstream
          cp -a upstream upstream-reference
      - name: Patch selection, command input and native Rust/egui preview
        run: |
          python3 scripts/patch-upstream-selection.py
          test -s upstream/apps/cadcraft-web/src/android_preview.rs
          test -s upstream/crates/cadcraft-android-3d/Cargo.toml
          grep -q 'cadcraft-android-3d' upstream/apps/cadcraft-web/Cargo.toml
      - name: Build exact upstream WASM web shell (not APK)
        working-directory: upstream
        run: cargo check --locked --target wasm32-unknown-unknown -p cadcraft-web -j 3
      - name: Run actual Rust/egui preview feature integration tests
        run: python3 tests/preview/run.py upstream-reference
  package-preview-apk:
    name: Android APK milestone — Rust/egui preview
    # Only the dedicated integration PR #10, not other commits/projects.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 10 }}
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk for pinned CADCraft upstream
        run: cargo install trunk --locked
      - name: Clone exact CADCraft 0.13.0 and patch UI with native preview
        run: |
          git clone --depth 1 --branch v0.13.0 https://github.com/storytold/cadcraft.git upstream
          python3 scripts/patch-upstream-selection.py
          test -s upstream/apps/cadcraft-web/src/android_preview.rs
      - name: Release-build full WASM bundle
        working-directory: upstream/apps/cadcraft-web
        run: trunk build --release
      - name: Verify and include real Rust/egui UI
        run: |
          test -s upstream/dist/web/index.html
          test -s upstream/apps/cadcraft-web/src/android_preview.rs
          mkdir -p app/src/main/assets/web
          cp -a upstream/dist/web/. app/src/main/assets/web/
          test -s app/src/main/assets/web/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android build tools
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:?}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK with 2D drawing and integrated Rust preview
        run: gradle --no-daemon --max-workers=4 :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-Issue2-Rust-Preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

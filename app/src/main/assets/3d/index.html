<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let poly=[[0,0],[100,0],[100,60],[0,60]], height=25, az=-0.75, el=0.5, zoom=2.6;
let model=null,profileFromDXF=false,sourceHandle=null,faceMode=false,selectedFace=-1;
let storedSolids=[],activeSolidId=1,nextSolidId=2,activeOffset=[0,0,0];
let derivedSolids=[],selectedDerivedId=null; const status=document.getElementById('status');
function number(id){return Number(document.getElementById(id).value);}
function setStatus(t){status.textContent=t;}
function validate(p,h){if(p.length<3||!p.every(q=>q.every(Number.isFinite))||!Number.isFinite(h)||Math.abs(h)<1e-8)throw Error('Perfil o altura no válidos');}
function cross2(a,b,c){return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);}
function inside(p,a,b,c){return cross2(a,b,p)>=-1e-8&&cross2(b,c,p)>=-1e-8&&cross2(c,a,p)>=-1e-8;}
function triangulate(points){
 const p=points.slice();let area=0;for(let i=0;i<p.length;i++){let j=(i+1)%p.length;area+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}
 if(Math.abs(area)<1e-9)throw Error('Área cero');if(area<0)p.reverse();
 // Reject self-intersecting profiles instead of producing invalid exported solids.
 function seg(a,b,c,d){
   const cr=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
   const o=[cr(a,b,c),cr(a,b,d),cr(c,d,a),cr(c,d,b)];
   const on=(p,q,r)=>r[0]>=Math.min(p[0],q[0])-1e-9&&r[0]<=Math.max(p[0],q[0])+1e-9&&r[1]>=Math.min(p[1],q[1])-1e-9&&r[1]<=Math.max(p[1],q[1])+1e-9;
   return (o[0]*o[1]<0&&o[2]*o[3]<0)||(Math.abs(o[0])<1e-9&&on(a,b,c))||(Math.abs(o[1])<1e-9&&on(a,b,d))||(Math.abs(o[2])<1e-9&&on(c,d,a))||(Math.abs(o[3])<1e-9&&on(c,d,b));
 }
 for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
   if((i+1)%p.length===j||(j+1)%p.length===i)continue;
   if(seg(p[i],p[(i+1)%p.length],p[j],p[(j+1)%p.length]))throw Error('El perfil se cruza consigo mismo');
 }
 const ids=p.map((_,i)=>i),tri=[];let guard=0;
 while(ids.length>3&&guard++<p.length*p.length){let found=false;for(let k=0;k<ids.length;k++){
 const a=ids[(k+ids.length-1)%ids.length],b=ids[k],c=ids[(k+1)%ids.length];
 if(cross2(p[a],p[b],p[c])<=1e-9)continue;
 if(ids.some(v=>v!==a&&v!==b&&v!==c&&inside(p[v],p[a],p[b],p[c])))continue;
 tri.push([a,b,c]);ids.splice(k,1);found=true;break;
 }if(!found)throw Error('Perfil no válido o autointersección');}
 if(ids.length!==3)throw Error('No se pudo triangular');tri.push(ids.slice());return {p,tri};
}
function extrude(points,h){
 validate(points,h);let clean=points.filter((a,i)=>i===0||Math.hypot(a[0]-points[i-1][0],a[1]-points[i-1][1])>1e-8);
 if(clean.length>1&&Math.hypot(clean[0][0]-clean.at(-1)[0],clean[0][1]-clean.at(-1)[1])<1e-8)clean.pop();
 const {p,tri}=triangulate(clean),n=p.length,v=[...p.map(a=>[...a,0]),...p.map(a=>[...a,h])],faces=[];
 for(const t of tri){if(h>0){faces.push([t[2],t[1],t[0]],[t[0]+n,t[1]+n,t[2]+n]);}else{faces.push(t,[t[2]+n,t[1]+n,t[0]+n]);}}
 for(let i=0;i<n;i++){const j=(i+1)%n;if(h>0)faces.push([i,j,j+n],[i,j+n,i+n]);else faces.push([j+n,j,i],[i+n,j+n,i]);}
 return {v,faces,outline:p,h};
}
function offsetMesh(mesh, offset){
 return {v:mesh.v.map(p=>p.map((v,i)=>v+offset[i])),faces:mesh.faces.map(face=>face.slice()),outline:mesh.outline,h:mesh.h};
}
function captureActiveSolid(){
 if(!model)throw Error('No hay pieza activa');
 return {id:activeSolidId,profile:poly.map(p=>p.slice()),height,sourceHandle,offset:activeOffset.slice(),mesh:model};
}
function restoreActiveSolid(record){
 activeSolidId=record.id;poly=record.profile.map(p=>p.slice());height=record.height;
 sourceHandle=record.sourceHandle||null;activeOffset=record.offset.slice();model=record.mesh||extrude(poly,height);
 profileFromDXF=true;selectedFace=-1;
 document.getElementById('height').value=String(height);syncOffsetFields();
}
function validateOffset(value){
 if(!Array.isArray(value)||value.length!==3||!value.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e8))throw Error('Desplazamiento 3D no válido');
 return value.slice();
}
function createSceneSolid(){
 if(!model||storedSolids.length+derivedSolids.length>=23){setStatus('Límite de 24 piezas');return false;}
 try{
  const next=extrude([[0,0],[100,0],[100,60],[0,60]],25);
  const farthestX=Math.max(...allSceneMeshes().flatMap(item=>item.v.map(p=>p[0])));
  storedSolids.push(captureActiveSolid());invalidateSceneContacts();
  activeSolidId=nextSolidId++;selectedDerivedId=null;activeOffset=[farthestX+20,0,0];
  poly=[[0,0],[100,0],[100,60],[0,60]];height=25;model=next;sourceHandle=null;profileFromDXF=true;selectedFace=-1;
  document.getElementById('height').value='25';syncOffsetFields();
  fit();setStatus('Nueva pieza '+activeSolidId+' · '+(storedSolids.length+1)+' en escena');return true;
 }catch(e){setStatus('Nueva pieza: '+e.message);return false;}
}
function duplicateSceneSolid(){
 if(selectedDerived()){setStatus('Para duplicar una malla usa Duplicar resultado');return false;}
 if(!model||storedSolids.length+derivedSolids.length>=23){setStatus('Límite de 24 piezas');return false;}
 try{
  const xs=model.v.map(p=>p[0]),width=Math.max(...xs)-Math.min(...xs);
  const copy=captureActiveSolid();copy.id=nextSolidId++;
  copy.offset=[activeOffset[0]+width+20,activeOffset[1],activeOffset[2]];
  copy.profile=copy.profile.map(p=>p.slice());
  copy.mesh=extrude(copy.profile,copy.height);storedSolids.push(copy);selectedDerivedId=null;syncOffsetFields();invalidateSceneContacts();
  fit();setStatus('Duplicada como pieza '+copy.id);return true;
 }catch(e){setStatus('Duplicar: '+e.message);return false;}
}
function cycleSceneSolid(){
 if(selectedDerivedId)selectedDerivedId=null;
 if(!storedSolids.length)return false;
 const current=captureActiveSolid();
 const next=storedSolids.shift();storedSolids.push(current);
 restoreActiveSolid(next);selectedDerivedId=null;invalidateSceneContacts();fit();setStatus('Pieza activa '+activeSolidId);return true;
}
function deleteSceneSolid(){
 if(selectedDerived()){setStatus('Pulsa Eliminar resultado para borrar la malla booleana');return false;}
 if(!storedSolids.length){setStatus('Debe quedar al menos una pieza');return false;}
 const next=storedSolids.pop();restoreActiveSolid(next);selectedDerivedId=null;invalidateSceneContacts();
 fit();setStatus('Pieza eliminada · '+(storedSolids.length+1)+' restantes');return true;
}
function invalidateSceneContacts(){
 const label=document.getElementById('contactInfo');
 if(label)label.textContent='Escena modificada · vuelve a comprobar contactos';
}
function selectedDerived(){return derivedSolids.find(item=>item.id===selectedDerivedId)||null;}
function moveActiveSolid(x,y,z){
 const candidate=validateOffset([x,y,z]);
 const derived=selectedDerived();if(derived)derived.offset=candidate;else activeOffset=candidate;
 invalidateSceneContacts();render();return true;
}
function syncOffsetFields(){
 for(let i=0;i<3;i++){
  const el=document.getElementById(['offsetX','offsetY','offsetZ'][i]);
  if(el)el.value=String((selectedDerived()||{offset:activeOffset}).offset[i]);
 }
}
function applyOffset(){
 const values=['offsetX','offsetY','offsetZ'].map(id=>{
  const el=document.getElementById(id);return el&&el.value.trim()!==''?Number(el.value):NaN;
 });
 try{moveActiveSolid(...values);setStatus('Pieza '+(selectedDerivedId||activeSolidId)+' movida · X '+values[0]+' Y '+values[1]+' Z '+values[2]);return true;}
 catch(e){setStatus('Mover pieza: '+e.message);return false;}
}

/* Collision detection for vertical prism extrusions: exact 2D polygon contacts
 * and overlapping Z intervals. Contact is NOT a boolean union operation. */
const contactEpsilon=1e-8;
function worldSolid(record){
 const m=record.mesh||extrude(record.profile,record.height);
 const offset=validateOffset(record.offset);
 const p=m.outline.map(q=>[q[0]+offset[0],q[1]+offset[1]]);
 const z0=offset[2]+Math.min(0,m.h),z1=offset[2]+Math.max(0,m.h);
 return {id:record.id,points:p,z0,z1,
  minX:Math.min(...p.map(q=>q[0])),maxX:Math.max(...p.map(q=>q[0])),
  minY:Math.min(...p.map(q=>q[1])),maxY:Math.max(...p.map(q=>q[1]))};
}
function segmentContact(a,b,c,d){
 const o1=cross2(a,b,c),o2=cross2(a,b,d),o3=cross2(c,d,a),o4=cross2(c,d,b);
 const eps=contactEpsilon;
 const opposite=(u,v)=>(u>eps&&v< -eps)||(u< -eps&&v>eps);
 if(opposite(o1,o2)&&opposite(o3,o4))return 2; // crossing interiors
 const on=(p,q,r)=>Math.abs(cross2(p,q,r))<=eps&&
  r[0]>=Math.min(p[0],q[0])-eps&&r[0]<=Math.max(p[0],q[0])+eps&&
  r[1]>=Math.min(p[1],q[1])-eps&&r[1]<=Math.max(p[1],q[1])+eps;
 return (on(a,b,c)||on(a,b,d)||on(c,d,a)||on(c,d,b))?1:0;
}
function pointInContour(point,polygon){
 // 0 boundary, 1 strictly inside, -1 outside
 let interior=false;const eps=contactEpsilon;
 for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
  const a=polygon[j],b=polygon[i];
  if(Math.abs(cross2(a,b,point))<=eps &&
    point[0]>=Math.min(a[0],b[0])-eps&&point[0]<=Math.max(a[0],b[0])+eps &&
    point[1]>=Math.min(a[1],b[1])-eps&&point[1]<=Math.max(a[1],b[1])+eps)return 0;
  if((a[1]>point[1])!==(b[1]>point[1])){
   const crossing=a[0]+(point[1]-a[1])*(b[0]-a[0])/(b[1]-a[1]);
   if(crossing>point[0])interior=!interior;
  }
 }
 return interior?1:-1;
}
function planarContact(a,b){
 let touch=false,strict=false;
 for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++){
  const hit=segmentContact(a[i],a[(i+1)%a.length],b[j],b[(j+1)%b.length]);
  if(hit===2)strict=true;
  if(hit)touch=true;
 }
 if(!strict){
  if(a.some(p=>pointInContour(p,b)===1)||b.some(p=>pointInContour(p,a)===1))strict=true;
 }
 if(!strict){
  // Covers coincident contours: all vertices may lie exactly on boundaries.
  for(const [polygon,other] of [[a,b],[b,a]]){
   const {p,tri}=triangulate(polygon);
   if(tri.some(ids=>pointInContour([
    (p[ids[0]][0]+p[ids[1]][0]+p[ids[2]][0])/3,
    (p[ids[0]][1]+p[ids[1]][1]+p[ids[2]][1])/3],other)===1)){strict=true;break;}
  }
 }
 return strict?2:touch?1:0;
}
function relationBetweenSolids(first,second){
 const a=worldSolid(first),b=worldSolid(second),eps=contactEpsilon;
 if(a.maxX<b.minX-eps||b.maxX<a.minX-eps||
    a.maxY<b.minY-eps||b.maxY<a.minY-eps||
    a.z1<b.z0-eps||b.z1<a.z0-eps)return 'separadas';
 const xy=planarContact(a.points,b.points);
 if(!xy)return 'separadas';
 const zOverlap=Math.min(a.z1,b.z1)-Math.max(a.z0,b.z0);
 return xy===2&&zOverlap>eps?'interseccion':'contacto';
}
/* Exact-area planar clipping over triangulated simple polygons. For two
 * vertical prism extrusions, volume overlap = intersection area * Z overlap.
 * This computes quantities, not a boolean output mesh. */
function polygonSignedArea(vertices){
 let area=0;
 for(let i=0;i<vertices.length;i++){
  const a=vertices[i],b=vertices[(i+1)%vertices.length];
  area+=a[0]*b[1]-b[0]*a[1];
 }
 return area*0.5;
}
function polygonArea(vertices){return Math.abs(polygonSignedArea(vertices));}
function clipConvexPolygon(subject,clipper){
 let polygon=subject.map(p=>p.slice());
 const oriented=polygonSignedArea(clipper)>=0?clipper:clipper.slice().reverse();
 for(let i=0;i<oriented.length&&polygon.length;i++){
  const a=oriented[i],b=oriented[(i+1)%oriented.length],result=[];
  const d=point=>cross2(a,b,point);
  for(let j=0;j<polygon.length;j++){
   const cur=polygon[j],prev=polygon[(j+polygon.length-1)%polygon.length];
   const dc=d(cur),dp=d(prev),inside=dc>=-contactEpsilon,prior=dp>=-contactEpsilon;
   if(inside!==prior){
    const denom=dp-dc;
    if(Math.abs(denom)>1e-14){
     const t=Math.max(0,Math.min(1,dp/denom));
     result.push([prev[0]+(cur[0]-prev[0])*t,prev[1]+(cur[1]-prev[1])*t]);
    }
   }
   if(inside)result.push(cur);
  }
  polygon=result;
 }
 return polygon;
}
function contourIntersectionArea(first,second){
 const ta=triangulate(first),tb=triangulate(second);
 let area=0;
 for(const i of ta.tri)for(const j of tb.tri){
  const a=i.map(k=>ta.p[k]),b=j.map(k=>tb.p[k]);
  const bounds=p=>[Math.min(...p.map(q=>q[0])),Math.max(...p.map(q=>q[0])),
                   Math.min(...p.map(q=>q[1])),Math.max(...p.map(q=>q[1]))];
  const aa=bounds(a),bb=bounds(b);
  if(aa[1]<=bb[0]||bb[1]<=aa[0]||aa[3]<=bb[2]||bb[3]<=aa[2])continue;
  const intersection=clipConvexPolygon(a,b);
  if(intersection.length>=3)area+=polygonArea(intersection);
 }
 return Math.max(0,Math.min(area,polygonArea(first),polygonArea(second)));
}
function prismOverlapMetrics(first,second){
 const a=worldSolid(first),b=worldSolid(second);
 const za=Math.max(0,Math.min(a.z1,b.z1)-Math.max(a.z0,b.z0));
 const overlapArea=za>0?contourIntersectionArea(a.points,b.points):0;
 const intersectionVolume=overlapArea*za;
 const va=polygonArea(a.points)*(a.z1-a.z0),vb=polygonArea(b.points)*(b.z1-b.z0);
 return {area:overlapArea,zOverlap:za,intersectionVolume,
  unionVolume:Math.max(0,va+vb-intersectionVolume),
  differenceA:Math.max(0,va-intersectionVolume),
  differenceB:Math.max(0,vb-intersectionVolume)};
}
function previewBooleanVolumes(){
 if(!storedSolids.length){setStatus('Añade una segunda pieza para comparar');return null;}
 try{
  const active=captureActiveSolid(),other=storedSolids[0],m=prismOverlapMetrics(active,other);
  const round=x=>Number(x.toFixed(3)).toLocaleString('es-ES');
  const label=document.getElementById('contactInfo');
  const msg='Pieza '+active.id+' ∪ '+other.id+': '+round(m.unionVolume)+
    ' mm³ · '+active.id+' − '+other.id+': '+round(m.differenceA)+
    ' mm³ · Solapamiento: '+round(m.intersectionVolume)+' mm³';
  if(label)label.textContent=msg;
  setStatus('Volúmenes calculados; todavía no se genera una malla booleana');
  return m;
 }catch(e){setStatus('Volúmenes: '+e.message);return null;}
}

/* First actual boolean meshes: two axis-aligned rectangular prisms only.
 * Decompose at every X/Y/Z box boundary, retain occupied cells, and emit
 * only outward-facing surface quads. This intentionally rejects curved,
 * concave or nonrectangular footprints; those need a true CSG/B-Rep engine. */
function rectangularBox(record){
 const prism=worldSolid(record),p=prism.points;
 if(p.length!==4)throw Error('La booleana solo admite rectángulos de cuatro vértices');
 const w=prism.maxX-prism.minX,l=prism.maxY-prism.minY;
 if(w<=contactEpsilon||l<=contactEpsilon||
    Math.abs(polygonArea(p)-w*l)>Math.max(contactEpsilon,w*l*1e-8)||

function booleanBoxMesh(first,second,mode){

   [a.min[axis],a.max[axis],b.min[axis],b.max[axis]].sort((u,v)=>u-v)

  const p=[(coords[0][i]+coords[0][i+1])/2,(coords[1][j]+coords[1][j+1])/2,(coords[2][k]+coords[2][k+1])/2];

  if(!has(i,j-1,k))quad([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]);
  if(!has(i,j+1,k))quad([[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]]);
  if(!has(i,j,k-1))quad([[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]]);

function meshOrientedVolume(solid){

function sceneContacts(records){

  const relation=relationBetweenSolids(records[i],records[j]);
  if(relation!=='separadas'){
   const volume=relation==='interseccion'?prismOverlapMetrics(records[i],records[j]).intersectionVolume:0;
   result.push({a:records[i].id,b:records[j].id,relation,volume});
  }

}

  const message=result.length?result.map(r=>'Pieza '+r.a+' y '+r.b+': '+(r.relation==='interseccion'?'INTERSECCIÓN · '+Number(r.volume.toFixed(3)).toLocaleString('es-ES')+' mm³':'contacto')).join(' · '):'No hay piezas que se toquen o se crucen';

/* Boolean results are independent triangle-mesh objects in the scene.
 * They can be selected, translated, duplicated and deleted, but they do NOT
 * pretend to have an editable extrusion sketch or parametric feature tree. */
function validateDerivedMesh(mesh){
 if(!mesh||!Array.isArray(mesh.v)||!Array.isArray(mesh.faces)||
   mesh.v.length<4||mesh.v.length>8000||mesh.faces.length<4||mesh.faces.length>16000)
  throw Error('Malla booleana incompatible o demasiado grande');
 if(!mesh.v.every(p=>Array.isArray(p)&&p.length===3&&p.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e8)))
  throw Error('Vértices 3D inválidos');
 if(!mesh.faces.every(f=>Array.isArray(f)&&f.length===3&&f.every(i=>Number.isInteger(i)&&i>=0&&i<mesh.v.length)&&new Set(f).size===3))
  throw Error('Caras 3D inválidas');
 const edges=new Map();
 for(const [a,b,c] of mesh.faces){
  const u=mesh.v[b].map((v,i)=>v-mesh.v[a][i]),w=mesh.v[c].map((v,i)=>v-mesh.v[a][i]);
  const cross=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
  if(Math.hypot(...cross)<1e-10)throw Error('Triángulo degenerado');
  for(const [i,j] of [[a,b],[b,c],[c,a]]){
   const key=i<j?i+':'+j:j+':'+i;
   edges.set(key,(edges.get(key)||0)+1);
  }
 }
 if([...edges.values()].some(n=>n!==2))throw Error('Malla abierta o no manifold');
 if(!(meshOrientedVolume(mesh)>1e-8))throw Error('Malla vacía o invertida');
 return {v:mesh.v.map(p=>p.slice()),faces:mesh.faces.map(f=>f.slice())};
}

function allSceneMeshes(){

  if(scene.owners[index]!== (selectedDerivedId||activeSolidId))continue;

function makeProjection(scene=model){
 const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 const right=[-sa,ca,0],up=[-ca*se,-sa*se,ce],depth=[ca*ce,sa*ce,se];
 const mid=scene&&scene.v.length?scene.v.reduce((a,p)=>a.map((v,i)=>v+p[i]/scene.v.length),[0,0,0]):[0,0,0];
 return p=>{let d=p.map((v,i)=>v-mid[i]);return {x:d.reduce((s,v,i)=>s+v*right[i],0),y:d.reduce((s,v,i)=>s+v*up[i],0),z:d.reduce((s,v,i)=>s+v*depth[i],0)};};
}
function resize(){const d=devicePixelRatio||1;canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);render();}
function render(){if(!canvas.width||!model)return;renderMeasurements();const c=ctx,w=canvas.width,h=canvas.height,d=devicePixelRatio||1;c.clearRect(0,0,w,h);c.fillStyle='#202b3a';c.fillRect(0,0,w,h);

 let sorted=scene.faces.map((face,index)=>({face,index,z:face.reduce((s,i)=>s+verts[i].z,0)/3})).sort((a,b)=>a.z-b.z);
 for(const {face,index} of sorted){let a=to(verts[face[0]]),b=to(verts[face[1]]),cc=to(verts[face[2]]);
 const va=scene.v[face[0]],vb=scene.v[face[1]],vc=scene.v[face[2]];
 const u=vb.map((v,i)=>v-va[i]),v=vc.map((x,i)=>x-va[i]);
 const normal=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
 const mag=Math.hypot(...normal)||1,lit=Math.max(0.12,Math.min(1,0.55+0.45*(normal[0]*0.3+normal[1]*-0.5+normal[2]*0.8)/mag));

 c.fillStyle='rgb('+Math.round(85+82*lit)+','+Math.round(111+98*lit)+','+Math.round(147+88*lit)+')';c.fill();
 c.strokeStyle='#16283a';c.lineWidth=0.6*d;c.stroke();if(scene.owners[index]===(selectedDerivedId||activeSolidId)&&index===selectedFace){c.fillStyle='rgba(255,152,47,0.55)';c.fill();c.strokeStyle='#ffb65a';c.lineWidth=2*d;c.stroke();}

}

 for(const vertex of combinedScene().v)for(let i=0;i<3;i++){min[i]=Math.min(min[i],vertex[i]);max[i]=Math.max(max[i],vertex[i]);}zoom=Math.max(.1,Math.min(canvas.clientWidth,canvas.clientHeight)*.7/(Math.hypot(...max.map((v,i)=>v-min[i]))||1));render();}

function meshMeasurements(solid){
 if(!solid||!Array.isArray(solid.outline)||!Number.isFinite(solid.h))throw Error('No hay sólido válido');
 const p=solid.outline;
 let doubleArea=0,perimeter=0;
 for(let i=0;i<p.length;i++){
  const a=p[i],b=p[(i+1)%p.length];
  doubleArea+=a[0]*b[1]-b[0]*a[1];
  perimeter+=Math.hypot(b[0]-a[0],b[1]-a[1]);

 const area=Math.abs(doubleArea)*.5;
 return {area,perimeter,volume:area*Math.abs(solid.h),surface:area*2+perimeter*Math.abs(solid.h),triangles:solid.faces.length};
}

  setStatus('Perfil DXF preparado para guardar');
 }catch(e){setStatus('DXF: '+e.message);}
}


function plainSolidRecord(record){
 return {id:record.id,profile:record.profile.map(p=>p.slice()),height:record.height,offset:record.offset.slice(),sourceHandle:record.sourceHandle||null};
}
function serializeDerivedSolid(item){
 return {id:item.id,mode:item.mode,parents:item.parents.slice(),offset:item.offset.slice(),
  mesh:{v:item.mesh.v.map(p=>p.slice()),faces:item.mesh.faces.map(f=>f.slice())}};
}
function projectData(){
 return {
  format:'cadcraft-android-3d',version:3,
  profile:poly.map(p=>p.slice()),height,sourceHandle,
  activeSolidId,activeOffset:activeOffset.slice(),
  solids:storedSolids.map(plainSolidRecord),
  derivedSolids:derivedSolids.map(serializeDerivedSolid),
  selectedDerivedId
 };
}
function serializeProject(){return JSON.stringify(projectData(),null,2);}
function validateProjectSolid(data,id,offset){
 if(!data||!Array.isArray(data.profile)||data.profile.length<3||data.profile.length>10000)throw Error('Perfil de pieza inválido');
 if(!data.profile.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n))))throw Error('Coordenadas incorrectas');
 if(typeof data.height!=='number'||!Number.isFinite(data.height)||Math.abs(data.height)<1e-8)throw Error('Altura incorrecta');
 if(!Number.isSafeInteger(id)||id<1)throw Error('ID de pieza no válido');
 const mesh=extrude(data.profile,data.height);
 return {id,profile:data.profile.map(p=>p.slice()),height:data.height,
  sourceHandle:typeof data.sourceHandle==='string'?data.sourceHandle:null,
  offset:validateOffset(offset),mesh};
}
function validateProjectDerived(data){
 if(!data||!Number.isSafeInteger(data.id)||data.id<1||
    !['union','subtract','intersect'].includes(data.mode)||
    !Array.isArray(data.parents)||data.parents.length!==2||
    !data.parents.every(id=>Number.isSafeInteger(id)&&id>0))
  throw Error('Registro booleano incompatible');
 return {id:data.id,mode:data.mode,parents:data.parents.slice(),
  offset:validateOffset(data.offset),mesh:validateDerivedMesh(data.mesh)};
}
function loadProjectText(text){
 if(typeof text!=='string'||text.length>2000000)throw Error('Proyecto demasiado grande');
 const parsed=JSON.parse(text);
 if(!parsed||parsed.format!=='cadcraft-android-3d'||![1,2,3].includes(parsed.version))throw Error('Formato de proyecto no compatible');
 const legacy=parsed.version===1;
 const main=validateProjectSolid(parsed,legacy?1:parsed.activeSolidId,legacy?[0,0,0]:parsed.activeOffset);
 const others=legacy?[]:parsed.solids;
 if(!Array.isArray(others)||others.length>23)throw Error('Demasiadas piezas en el proyecto');
 const records=others.map(r=>validateProjectSolid(r,r.id,r.offset));
 const output=parsed.version===3?parsed.derivedSolids:[];
 if(!Array.isArray(output)||output.length+records.length>23)throw Error('Demasiadas piezas en el proyecto');
 const meshes=output.map(validateProjectDerived);
 const ids=[main.id,...records.map(p=>p.id),...meshes.map(p=>p.id)];
 if(new Set(ids).size!==ids.length)throw Error('ID de pieza duplicado');
 const selected=parsed.version===3&&parsed.selectedDerivedId!=null?parsed.selectedDerivedId:null;
 if(selected!=null&&!meshes.some(m=>m.id===selected))throw Error('Selección booleana no existe');
 // Atomic commit: failure in the mesh validation preserves the current scene.
 storedSolids=records;derivedSolids=meshes;selectedDerivedId=selected;
 nextSolidId=Math.max(...ids)+1;
 restoreActiveSolid(main);syncOffsetFields();invalidateSceneContacts();
 fit();setStatus('Proyecto cargado · '+ids.length+' pieza(s)');
 return model;
}
function saveProject(){
 try{
  const content=serializeProject();
  if(content.length>2000000)throw Error('El proyecto supera 2 MB; reduce la complejidad antes de guardarlo');
  const blob=new Blob([content],{type:'application/json'});
  const a=document.createElement('a');a.download='CADCraft_proyecto.json';
  a.href=URL.createObjectURL(blob);a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  setStatus('Proyecto preparado para guardar');return true;
 }catch(e){setStatus('Guardar: '+e.message);return false;}
}
function pickProject(){document.getElementById('projectFile').click();}
document.getElementById('projectFile').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{if(f.size>2000000)throw Error('Proyecto demasiado grande');loadProjectText(await f.text());}
 catch(err){setStatus('Proyecto: '+err.message);}
 e.target.value='';
});

function parseDxfProfile(text){
 const lines=text.replace(/\r/g,'').split('\n'),pairs=[];
 for(let i=0;i<lines.length-1;i+=2)pairs.push([lines[i].trim(),lines[i+1].trim()]);
 let profiles=[];
 for(let i=0;i<pairs.length;i++){
  if(pairs[i][0]==='0'&&pairs[i][1]==='LWPOLYLINE'){
   let pts=[],closed=false,bulge=false;
   for(i++;i<pairs.length&&pairs[i][0]!=='0';i++){
    let [code,value]=pairs[i];
    if(code==='10')pts.push([Number(value),NaN]);
    else if(code==='20'&&pts.length)pts[pts.length-1][1]=Number(value);
    else if(code==='70')closed=(Number(value)&1)!==0;
    else if(code==='42'&&Math.abs(Number(value))>1e-9)bulge=true;
   }
   i--;
   if(closed&&pts.length>=3&&!bulge)profiles.push(pts);
  }
 }
 if(!profiles.length)throw Error('No hay LWPOLYLINE cerradas con segmentos rectos');
 return profiles[0];
}
function importDxfText(text){
 const points=parseDxfProfile(text);
 setSketchProfile(points);
 setStatus('Perfil DXF importado · '+points.length+' vértices');
 return model;
}
document.getElementById('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{importDxfText(await f.text());}
 catch(err){setStatus('DXF: '+err.message);}
 e.target.value='';
});
function receive2dHandoff(){
 try {
  const key='cadcraft.android.dxf.handoff';
  const data=sessionStorage.getItem(key);
  if(!data)return;
  sessionStorage.removeItem(key);
  importDxfText(data);
 }catch(e){setStatus('Transferencia 2D: '+e.message);}
}


/* A one-time same-origin handoff populated from the actual selection in
   CADCraft's WASM editor (not from a manually saved DXF). */
function receiveSelectedProfile(){
 const key='cadcraft.android.profile.handoff';
 try{
  const raw=sessionStorage.getItem(key);
  if(!raw)return false;
  sessionStorage.removeItem(key);
  if(raw.length>512000)throw Error('Transferencia demasiado grande');
  const data=JSON.parse(raw);
  if(!data||data.version!==1||!Array.isArray(data.points)||data.points.length>10000)
   throw Error('Perfil 2D incompatible');
  const next=setSketchProfile(data.points);
  sourceHandle=typeof data.sourceHandle==='string'?data.sourceHandle:null;
  setStatus('Selección CADCraft extruida · '+next.outline.length+' vértices'+(sourceHandle?' · ID '+sourceHandle:''));
  return true;
 }catch(e){setStatus('Selección 2D: '+e.message);return false;}
}

/* Local planar sketch: shared outline and height with the existing extrusion model.
   This is deliberately separate from upstream CADCraft's document model. */
let sketchPoints=[],sketchActive=false,selectedSketchVertex=-1,sketchDragId=null,sketchDragRecorded=false;
let sketchHistory=[],sketchRedoHistory=[],sketchSnapping=true;
const sketchStep=5,sketchScale=2;
function cloneSketch(points){return points.map(p=>p.slice());}
function pushSketchHistory(){sketchHistory.push(cloneSketch(sketchPoints));if(sketchHistory.length>100)sketchHistory.shift();sketchRedoHistory=[];}
function undoSketchState(){if(!sketchHistory.length)return false;sketchRedoHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchHistory.pop();selectedSketchVertex=-1;return true;}
function redoSketchState(){if(!sketchRedoHistory.length)return false;sketchHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchRedoHistory.pop();selectedSketchVertex=-1;return true;}
function rectangleSketch(w,l){if(!Number.isFinite(w)||!Number.isFinite(l)||w<=0||l<=0)throw Error('Ancho y largo deben ser positivos');return [[0,0],[w,0],[w,l],[0,l]];}
function circleSketch(diameter,segments=48){
 if(!Number.isFinite(diameter)||diameter<=0||!Number.isInteger(segments)||segments<12||segments>128)throw Error('Diámetro o resolución no válidos');
 const r=diameter/2;
 return Array.from({length:segments},(_,i)=>[Math.cos(i*Math.PI*2/segments)*r,Math.sin(i*Math.PI*2/segments)*r]);
}
function removeSketchVertex(index){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length)return false;
 pushSketchHistory();sketchPoints.splice(index,1);selectedSketchVertex=-1;return true;
}
function snapSketchPoint(x,y){return sketchSnapping?[Math.round(x/sketchStep)*sketchStep,Math.round(y/sketchStep)*sketchStep]:[x,y];}
function moveSketchVertex(index,x,y){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length||!Number.isFinite(x)||!Number.isFinite(y))throw Error('Vértice o coordenadas incorrectos');
 pushSketchHistory();sketchPoints[index]=[x,y];selectedSketchVertex=index;return true;
}
function setSketchProfile(points){
 const candidate=points.map(p=>[Number(p[0]),Number(p[1])]);
 const next=extrude(candidate,number('height')); // validate BEFORE changing the live model
 poly=candidate;height=number('height');model=next;profileFromDXF=true;sourceHandle=null;selectedDerivedId=null;selectedFace=-1;syncOffsetFields();invalidateSceneContacts();
 fit();setStatus('Perfil 2D extruido · '+candidate.length+' vértices');
 return next;
}
function openSketch(){
 if(selectedDerived()){setStatus('El perfil del resultado booleano no es editable; vuelve a la extrusión');return false;}
 sketchPoints=cloneSketch(poly);sketchActive=true;sketchHistory=[];sketchRedoHistory=[];selectedSketchVertex=-1;sketchDragId=null;
 const panel=document.getElementById('sketchPanel');panel.classList.add('open');
 const sc=document.getElementById('sketchCanvas');
 if(!sc.dataset.ready){
  sc.addEventListener('pointerdown',e=>{
   if(!sketchActive)return;
   const rect=sc.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
   let nearest=-1,best=15;
   for(let i=0;i<sketchPoints.length;i++){
    const p=sketchPoints[i],dist=Math.hypot(rect.width/2+p[0]*sketchScale-x,rect.height/2-p[1]*sketchScale-y);
    if(dist<best){nearest=i;best=dist;}
   }
   if(nearest>=0){selectedSketchVertex=nearest;sketchDragId=e.pointerId;sketchDragRecorded=false;}
   else {
    if(sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Límite de vértices';return;}
    pushSketchHistory();sketchPoints.push(snapSketchPoint((x-rect.width/2)/sketchScale,(rect.height/2-y)/sketchScale));
    selectedSketchVertex=sketchPoints.length-1;sketchDragId=null;
   }
   if(sc.setPointerCapture)sc.setPointerCapture(e.pointerId);
   drawSketch();
  });
  sc.addEventListener('pointermove',e=>{
   if(!sketchActive||e.pointerId!==sketchDragId||selectedSketchVertex<0)return;
   const rect=sc.getBoundingClientRect(),p=snapSketchPoint((e.clientX-rect.left-rect.width/2)/sketchScale,(rect.height/2-(e.clientY-rect.top))/sketchScale);
   const old=sketchPoints[selectedSketchVertex];
   if(old[0]===p[0]&&old[1]===p[1])return;
   if(!sketchDragRecorded){pushSketchHistory();sketchDragRecorded=true;}
   sketchPoints[selectedSketchVertex]=p;drawSketch();
  });
  for(const event of ['pointerup','pointercancel'])sc.addEventListener(event,e=>{if(e.pointerId===sketchDragId)sketchDragId=null;});
  sc.dataset.ready='1';
 }
 requestAnimationFrame(drawSketch);
}
function drawSketch(){
 const sc=document.getElementById('sketchCanvas');if(!sc)return;
 const d=window.devicePixelRatio||1,r=sc.getBoundingClientRect();
 sc.width=Math.max(1,Math.round(r.width*d));sc.height=Math.max(1,Math.round(r.height*d));
 const c=sc.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const w=r.width,h=r.height; c.fillStyle='#14202e';c.fillRect(0,0,w,h);
 c.lineWidth=1;c.strokeStyle='#304052';
 const step=sketchStep*sketchScale;
 for(let x=w/2%step;x<w;x+=step){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}
 for(let y=h/2%step;y<h;y+=step){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
 const to=p=>[w/2+p[0]*sketchScale,h/2-p[1]*sketchScale];
 c.strokeStyle='#73d2ec';c.lineWidth=2;c.beginPath();
 sketchPoints.forEach((p,i)=>{const q=to(p);if(i===0)c.moveTo(...q);else c.lineTo(...q);});
 if(sketchPoints.length>=3)c.lineTo(...to(sketchPoints[0]));c.stroke();
 sketchPoints.forEach((p,i)=>{const q=to(p);c.beginPath();c.arc(...q,i===selectedSketchVertex?7:4,0,Math.PI*2);c.fillStyle=i===selectedSketchVertex?'#ff936c':'#fbc86c';c.fill();});
 if(selectedSketchVertex>=0&&sketchPoints[selectedSketchVertex]){
  document.getElementById('sketchX').value=String(sketchPoints[selectedSketchVertex][0]);
  document.getElementById('sketchY').value=String(sketchPoints[selectedSketchVertex][1]);
 }
 document.getElementById('sketchInfo').textContent=sketchPoints.length+' vértices · toca un punto y arrastra para editar · cuadrícula '+(sketchSnapping?'5 mm':'libre');
}
function addPrecisePoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 if(!sketchActive||!Number.isFinite(x)||!Number.isFinite(y)||sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Coordenadas XY no válidas o límite alcanzado';return false;}
 pushSketchHistory();sketchPoints.push([x,y]);selectedSketchVertex=sketchPoints.length-1;drawSketch();return true;
}
function updateSelectedPoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 try{if(!sketchActive)throw Error('Abre el editor');moveSketchVertex(selectedSketchVertex,x,y);drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeRectangleSketch(){
 try{const p=rectangleSketch(number('width'),number('length'));pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeCircleSketch(){
 try{
  const p=circleSketch(Number(document.getElementById('sketchDiameter').value));
  pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;
 }catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function deleteSelectedVertex(){
 if(!removeSketchVertex(selectedSketchVertex))return false;
 drawSketch();return true;
}
function toggleSketchSnap(){sketchSnapping=!sketchSnapping;document.getElementById('sketchSnapButton').textContent=sketchSnapping?'Rejilla ON':'Rejilla OFF';drawSketch();}
function undoSketch(){if(undoSketchState())drawSketch();}
function redoSketch(){if(redoSketchState())drawSketch();}
function clearSketch(){pushSketchHistory();sketchPoints=[];selectedSketchVertex=-1;drawSketch();}
function closeSketch(){sketchActive=false;sketchDragId=null;document.getElementById('sketchPanel').classList.remove('open');}
function finishSketch(){
 try{setSketchProfile(sketchPoints);closeSketch();}
 catch(e){document.getElementById('sketchInfo').textContent='Error: '+e.message;}
}

window.addEventListener('resize',resize);extrudeForm();resize();fit();if(!receiveSelectedProfile())receive2dHandoff();
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CADCraft 3D</title>
<style>html,body{height:100%;margin:0;background:#1c222d;color:#e7edf5;font:14px Arial,sans-serif}header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px;background:#303a49}button,input{background:#39485d;color:#fff;border:1px solid #647287;border-radius:7px;padding:10px;font-size:15px}button:active{background:#627895}main{position:relative;height:calc(100% - 102px)}canvas{width:100%;height:100%;display:block;touch-action:none}aside{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:7px;max-width:50%}aside label{display:flex;gap:6px;align-items:center;background:#303a49e9;border-radius:6px;padding:4px}aside input{width:65px}#cube{position:absolute;right:12px;top:12px;display:grid;grid-template-columns:repeat(3,40px);gap:3px;background:#263244d9;padding:6px;border-radius:8px}#cube button{padding:6px 0;font-size:12px}#status{position:absolute;bottom:8px;left:8px;background:#141c2dd9;padding:6px;border-radius:5px}footer{height:40px;display:flex;justify-content:space-around;align-items:center;background:#303a49}footer button{padding:5px 9px;font-size:13px}#sketchPanel{display:none;position:absolute;inset:4%;z-index:10;background:#202b3a;border:2px solid #7189a8;border-radius:12px;padding:10px;box-sizing:border-box;flex-direction:column;gap:8px}#sketchPanel.open{display:flex}#sketchCanvas{flex:1;min-height:80px;background:#14202e;border:1px solid #526980;touch-action:none;width:100%}#sketchPanel .toolbar{display:flex;flex-wrap:wrap;gap:6px}#sketchInfo{font-size:12px;color:#d4e0f4}</style></head>
<body><header><button onclick="location.href='../web/index.html'">CAD 2D</button><strong>CADCraft · 3D</strong><button onclick="exportSTL()">Exportar STL</button><button onclick="exportOBJ()">Exportar OBJ</button></header>
<main><canvas id="scene"></canvas><aside><label>Ancho <input id="width" type="number" value="100" min="0.01" step="1"></label><label>Largo <input id="length" type="number" value="60" min="0.01" step="1"></label><label>Altura <input id="height" type="number" value="25" step="1"></label><button onclick="extrudeForm()">EXTRUIR</button><button onclick="openSketch()">DIBUJAR PERFIL 2D</button><button onclick="pickDxf()">Abrir DXF</button><button onclick="exportProfileDxf()">Exportar DXF 2D</button><button onclick="saveProject()">Guardar proyecto</button><button onclick="pickProject()">Abrir proyecto</button><input type="file" id="projectFile" accept=".json,application/json" hidden><input type="file" id="file" accept=".dxf" hidden></aside>
<div id="cube"><span></span><button onclick="snap('top')">SUP</button><span></span><button onclick="snap('left')">IZQ</button><button onclick="snap('iso')">3D</button><button onclick="snap('right')">DER</button><span></span><button onclick="snap('front')">FTE</button><span></span></div>
<section id="sketchPanel" aria-label="Editor de perfil 2D"><strong>Perfil 2D · planta XY (mm)</strong><div id="sketchInfo">Pulsa para añadir vértices · cuadrícula 5 mm</div><div class="toolbar"><label>X (mm) <input id="sketchX" type="number" value="0" step="1"></label><label>Y (mm) <input id="sketchY" type="number" value="0" step="1"></label><button onclick="addPrecisePoint()">Añadir XY</button><button onclick="updateSelectedPoint()">Mover seleccionado</button></div><canvas id="sketchCanvas"></canvas><div class="toolbar"><button onclick="undoSketch()">Deshacer</button><button onclick="redoSketch()">Rehacer</button><button onclick="makeRectangleSketch()">Rectángulo exacto</button><label>Ø mm <input id="sketchDiameter" type="number" min="0.01" value="40" step="1"></label><button onclick="makeCircleSketch()">Círculo exacto</button><button onclick="deleteSelectedVertex()">Borrar vértice</button><button id="sketchSnapButton" onclick="toggleSketchSnap()">Rejilla ON</button><button onclick="clearSketch()">Borrar</button><button onclick="closeSketch()">Cancelar</button><button onclick="finishSketch()">Cerrar y extruir</button></div></section><div id="measurements" aria-live="polite" style="position:absolute;right:8px;bottom:52px;background:#141c2de8;padding:7px;border-radius:6px;max-width:60%;font-size:12px">Medidas del sólido</div><div id="status" role="status">Arrastra para girar · Pellizca para zoom</div></main><footer><button onclick="snap('iso')">Isométrica</button><button onclick="snap('top')">Superior</button><button onclick="snap('front')">Frontal</button><button onclick="fit()">Encuadrar</button></footer>
<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let poly=[[0,0],[100,0],[100,60],[0,60]], height=25, az=-0.75, el=0.5, zoom=2.6;
let model=null,profileFromDXF=false; const status=document.getElementById('status');
function number(id){return Number(document.getElementById(id).value);}
function setStatus(t){status.textContent=t;}
function validate(p,h){if(p.length<3||!p.every(q=>q.every(Number.isFinite))||!Number.isFinite(h)||Math.abs(h)<1e-8)throw Error('Perfil o altura no válidos');}
function cross2(a,b,c){return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);}
function inside(p,a,b,c){return cross2(a,b,p)>=-1e-8&&cross2(b,c,p)>=-1e-8&&cross2(c,a,p)>=-1e-8;}
function triangulate(points){
 const p=points.slice();let area=0;for(let i=0;i<p.length;i++){let j=(i+1)%p.length;area+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}
 if(Math.abs(area)<1e-9)throw Error('Área cero');if(area<0)p.reverse();
 // Reject self-intersecting profiles instead of producing invalid exported solids.
 function seg(a,b,c,d){
   const cr=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
   const o=[cr(a,b,c),cr(a,b,d),cr(c,d,a),cr(c,d,b)];
   const on=(p,q,r)=>r[0]>=Math.min(p[0],q[0])-1e-9&&r[0]<=Math.max(p[0],q[0])+1e-9&&r[1]>=Math.min(p[1],q[1])-1e-9&&r[1]<=Math.max(p[1],q[1])+1e-9;
   return (o[0]*o[1]<0&&o[2]*o[3]<0)||(Math.abs(o[0])<1e-9&&on(a,b,c))||(Math.abs(o[1])<1e-9&&on(a,b,d))||(Math.abs(o[2])<1e-9&&on(c,d,a))||(Math.abs(o[3])<1e-9&&on(c,d,b));
 }
 for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
   if((i+1)%p.length===j||(j+1)%p.length===i)continue;
   if(seg(p[i],p[(i+1)%p.length],p[j],p[(j+1)%p.length]))throw Error('El perfil se cruza consigo mismo');
 }
 const ids=p.map((_,i)=>i),tri=[];let guard=0;
 while(ids.length>3&&guard++<p.length*p.length){let found=false;for(let k=0;k<ids.length;k++){
 const a=ids[(k+ids.length-1)%ids.length],b=ids[k],c=ids[(k+1)%ids.length];
 if(cross2(p[a],p[b],p[c])<=1e-9)continue;
 if(ids.some(v=>v!==a&&v!==b&&v!==c&&inside(p[v],p[a],p[b],p[c])))continue;
 tri.push([a,b,c]);ids.splice(k,1);found=true;break;
 }if(!found)throw Error('Perfil no válido o autointersección');}
 if(ids.length!==3)throw Error('No se pudo triangular');tri.push(ids.slice());return {p,tri};
}
function extrude(points,h){
 validate(points,h);let clean=points.filter((a,i)=>i===0||Math.hypot(a[0]-points[i-1][0],a[1]-points[i-1][1])>1e-8);
 if(clean.length>1&&Math.hypot(clean[0][0]-clean.at(-1)[0],clean[0][1]-clean.at(-1)[1])<1e-8)clean.pop();
 const {p,tri}=triangulate(clean),n=p.length,v=[...p.map(a=>[...a,0]),...p.map(a=>[...a,h])],faces=[];
 for(const t of tri){if(h>0){faces.push([t[2],t[1],t[0]],[t[0]+n,t[1]+n,t[2]+n]);}else{faces.push(t,[t[2]+n,t[1]+n,t[0]+n]);}}
 for(let i=0;i<n;i++){const j=(i+1)%n;if(h>0)faces.push([i,j,j+n],[i,j+n,i+n]);else faces.push([j+n,j,i],[i+n,j+n,i]);}
 return {v,faces,outline:p,h};
}
function extrudeForm(){try{const w=number('width'),l=number('length'),h=number('height');if(!profileFromDXF){if(!(w>0&&l>0))throw Error('Medidas incorrectas');poly=[[0,0],[w,0],[w,l],[0,l]];} height=h;model=extrude(poly,height);render();setStatus('Sólido generado · '+model.faces.length+' triángulos');}catch(e){setStatus('Error: '+e.message);}}
function makeProjection(){
 const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 const right=[-sa,ca,0],up=[-ca*se,-sa*se,ce],depth=[ca*ce,sa*ce,se];
 const mid=model?model.v.reduce((a,p)=>a.map((v,i)=>v+p[i]/model.v.length),[0,0,0]):[0,0,0];
 return p=>{let d=p.map((v,i)=>v-mid[i]);return {x:d.reduce((s,v,i)=>s+v*right[i],0),y:d.reduce((s,v,i)=>s+v*up[i],0),z:d.reduce((s,v,i)=>s+v*depth[i],0)};};
}
function resize(){const d=devicePixelRatio||1;canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);render();}
function render(){if(!canvas.width||!model)return;renderMeasurements();const c=ctx,w=canvas.width,h=canvas.height,d=devicePixelRatio||1;c.clearRect(0,0,w,h);c.fillStyle='#202b3a';c.fillRect(0,0,w,h);
 const pr=makeProjection(),verts=model.v.map(pr);const sc=zoom*d; const to=p=>[w/2+p.x*sc,h/2-p.y*sc];
 let sorted=model.faces.map(face=>({face,z:face.reduce((s,i)=>s+verts[i].z,0)/3})).sort((a,b)=>a.z-b.z);
 for(const {face} of sorted){let a=to(verts[face[0]]),b=to(verts[face[1]]),cc=to(verts[face[2]]);
 const va=model.v[face[0]],vb=model.v[face[1]],vc=model.v[face[2]];
 const u=vb.map((v,i)=>v-va[i]),v=vc.map((x,i)=>x-va[i]);
 const normal=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
 const mag=Math.hypot(...normal)||1,lit=Math.max(0.12,Math.min(1,0.55+0.45*(normal[0]*0.3+normal[1]*-0.5+normal[2]*0.8)/mag));
 c.beginPath();c.moveTo(...a);c.lineTo(...b);c.lineTo(...cc);c.closePath();
 c.fillStyle='rgb('+Math.round(85+82*lit)+','+Math.round(111+98*lit)+','+Math.round(147+88*lit)+')';c.fill();
 c.strokeStyle='#16283a';c.lineWidth=0.6*d;c.stroke();
 }
}
function snap(name){({top:()=>{az=-.75;el=Math.PI/2},front:()=>{az=-Math.PI/2;el=0},left:()=>{az=Math.PI;el=0},right:()=>{az=0;el=0},iso:()=>{az=-.75;el=0.61548}}[name]||(()=>{}))();render();}
function fit(){if(!model)return;const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
 for(const vertex of model.v)for(let i=0;i<3;i++){min[i]=Math.min(min[i],vertex[i]);max[i]=Math.max(max[i],vertex[i]);}zoom=Math.max(.1,Math.min(canvas.clientWidth,canvas.clientHeight)*.7/(Math.hypot(...max.map((v,i)=>v-min[i]))||1));render();}
let pointers=new Map(),lastDist=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
if(pointers.size===1){az+=(e.clientX-prev[0])*.009;el=Math.max(-1.56,Math.min(1.56,el-(e.clientY-prev[1])*.009));render();}
else if(pointers.size===2){let q=[...pointers.values()],dist=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);if(lastDist)zoom=Math.max(.01,zoom*dist/lastDist);lastDist=dist;render();}});
for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,e=>{pointers.delete(e.pointerId);lastDist=0;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.01,zoom*Math.exp(-e.deltaY*.001));render();},{passive:false});

function meshMeasurements(solid){
 if(!solid||!Array.isArray(solid.outline)||!Number.isFinite(solid.h))throw Error('No hay sólido válido');
 const p=solid.outline;
 let doubleArea=0,perimeter=0;
 for(let i=0;i<p.length;i++){
  const a=p[i],b=p[(i+1)%p.length];
  doubleArea+=a[0]*b[1]-b[0]*a[1];
  perimeter+=Math.hypot(b[0]-a[0],b[1]-a[1]);
 }
 const area=Math.abs(doubleArea)*.5;
 return {area,perimeter,volume:area*Math.abs(solid.h),surface:area*2+perimeter*Math.abs(solid.h),triangles:solid.faces.length};
}
function renderMeasurements(){
 const element=document.getElementById('measurements');if(!element)return;
 try{
  const m=meshMeasurements(model),fmt=v=>Number(v.toFixed(2)).toLocaleString('es-ES');
  element.textContent='Área: '+fmt(m.area)+' mm² · Volumen: '+fmt(m.volume)+' mm³ · Superficie: '+fmt(m.surface)+' mm²';
 }catch(e){element.textContent='Sin sólido 3D';}
}
function meshAsObj(solid){
 if(!solid||!Array.isArray(solid.v)||!Array.isArray(solid.faces))throw Error('No hay modelo que exportar');
 const lines=['# CADCraft Android OBJ','o CADCraft3D'];
 for(const p of solid.v){if(p.length!==3||!p.every(Number.isFinite))throw Error('Coordenadas de vértices inválidas');lines.push('v '+p.join(' '));}
 for(const f of solid.faces){if(f.length!==3||!f.every(i=>Number.isInteger(i)&&i>=0&&i<solid.v.length))throw Error('Cara inválida');lines.push('f '+f.map(i=>i+1).join(' '));}
 return lines.join('\n')+'\n';
}
function exportOBJ(){
 try{
  const a=document.createElement('a');a.download='CADCraft_3D.obj';
  a.href=URL.createObjectURL(new Blob([meshAsObj(model)],{type:'text/plain'}));a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);setStatus('OBJ preparado para guardar');
 }catch(e){setStatus('OBJ: '+e.message);}
}

function exportSTL(){if(!model)return;let out='solid cadcraft_android\n';
 for(const f of model.faces){const a=model.v[f[0]],b=model.v[f[1]],c=model.v[f[2]],u=b.map((v,i)=>v-a[i]),v=c.map((x,i)=>x-a[i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],mag=Math.hypot(...n)||1;
 out+='facet normal '+n.map(x=>x/mag).join(' ')+'\n outer loop\n';
 for(const p of [a,b,c])out+=' vertex '+p.join(' ')+'\n';out+=' endloop\nendfacet\n';}
 out+='endsolid cadcraft_android\n';let a=document.createElement('a');a.download='CADCraft_3D.stl';a.href=URL.createObjectURL(new Blob([out],{type:'model/stl'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);setStatus('STL preparado para guardar');}
function pickDxf(){document.getElementById('file').click();}

function profileAsDxf(points){
 if(!Array.isArray(points)||points.length<3||points.length>10000)throw Error('Perfil inválido');
 // Validate shape using the same 3D kernel, avoiding export of non-closed geometry.
 extrude(points,1);
 const lines=['0','SECTION','2','ENTITIES','0','LWPOLYLINE','90',String(points.length),'70','1'];
 for(const p of points)lines.push('10',String(p[0]),'20',String(p[1]));
 lines.push('0','ENDSEC','0','EOF');
 return lines.join('\n')+'\n';
}
function exportProfileDxf(){
 try {
  const a=document.createElement('a');
  a.download='CADCraft_perfil_2D.dxf';
  a.href=URL.createObjectURL(new Blob([profileAsDxf(poly)],{type:'application/dxf'}));
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  setStatus('Perfil DXF preparado para guardar');
 }catch(e){setStatus('DXF: '+e.message);}
}


function projectData(){return {format:'cadcraft-android-3d',version:1,profile:poly.map(p=>p.slice()),height:height};}
function serializeProject(){return JSON.stringify(projectData(),null,2);}
function loadProjectText(text){
 const parsed=JSON.parse(text);
 if(parsed.format!=='cadcraft-android-3d'||parsed.version!==1||!Array.isArray(parsed.profile)||parsed.profile.length>10000)throw Error('Formato de proyecto no compatible');
 const p=parsed.profile;
 if(!p.every(a=>Array.isArray(a)&&a.length===2&&a.every(n=>typeof n==='number'&&Number.isFinite(n))))throw Error('Coordenadas incorrectas');
 if(typeof parsed.height!=='number'||!Number.isFinite(parsed.height))throw Error('Altura incorrecta');
 const next=extrude(p,parsed.height);
 poly=p.map(a=>a.slice());height=parsed.height;model=next;profileFromDXF=true;
 document.getElementById('height').value=String(height);
 fit();setStatus('Proyecto cargado · '+poly.length+' vértices');
 return model;
}
function saveProject(){
 const blob=new Blob([serializeProject()],{type:'application/json'});
 const a=document.createElement('a');a.download='CADCraft_proyecto.json';
 a.href=URL.createObjectURL(blob);a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 setStatus('Proyecto preparado para guardar');
}
function pickProject(){document.getElementById('projectFile').click();}
document.getElementById('projectFile').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{if(f.size>1000000)throw Error('Proyecto demasiado grande');loadProjectText(await f.text());}
 catch(err){setStatus('Proyecto: '+err.message);}
 e.target.value='';
});

function parseDxfProfile(text){
 const lines=text.replace(/\r/g,'').split('\n'),pairs=[];
 for(let i=0;i<lines.length-1;i+=2)pairs.push([lines[i].trim(),lines[i+1].trim()]);
 let profiles=[];
 for(let i=0;i<pairs.length;i++){
  if(pairs[i][0]==='0'&&pairs[i][1]==='LWPOLYLINE'){
   let pts=[],closed=false,bulge=false;
   for(i++;i<pairs.length&&pairs[i][0]!=='0';i++){
    let [code,value]=pairs[i];
    if(code==='10')pts.push([Number(value),NaN]);
    else if(code==='20'&&pts.length)pts[pts.length-1][1]=Number(value);
    else if(code==='70')closed=(Number(value)&1)!==0;
    else if(code==='42'&&Math.abs(Number(value))>1e-9)bulge=true;
   }
   i--;
   if(closed&&pts.length>=3&&!bulge)profiles.push(pts);
  }
 }
 if(!profiles.length)throw Error('No hay LWPOLYLINE cerradas con segmentos rectos');
 return profiles[0];
}
function importDxfText(text){
 const points=parseDxfProfile(text);
 setSketchProfile(points);
 setStatus('Perfil DXF importado · '+points.length+' vértices');
 return model;
}
document.getElementById('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{importDxfText(await f.text());}
 catch(err){setStatus('DXF: '+err.message);}
 e.target.value='';
});
function receive2dHandoff(){
 try {
  const key='cadcraft.android.dxf.handoff';
  const data=sessionStorage.getItem(key);
  if(!data)return;
  sessionStorage.removeItem(key);
  importDxfText(data);
 }catch(e){setStatus('Transferencia 2D: '+e.message);}
}

/* Local planar sketch: shared outline and height with the existing extrusion model.
   This is deliberately separate from upstream CADCraft's document model. */
let sketchPoints=[],sketchActive=false,selectedSketchVertex=-1,sketchDragId=null,sketchDragRecorded=false;
let sketchHistory=[],sketchRedoHistory=[],sketchSnapping=true;
const sketchStep=5,sketchScale=2;
function cloneSketch(points){return points.map(p=>p.slice());}
function pushSketchHistory(){sketchHistory.push(cloneSketch(sketchPoints));if(sketchHistory.length>100)sketchHistory.shift();sketchRedoHistory=[];}
function undoSketchState(){if(!sketchHistory.length)return false;sketchRedoHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchHistory.pop();selectedSketchVertex=-1;return true;}
function redoSketchState(){if(!sketchRedoHistory.length)return false;sketchHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchRedoHistory.pop();selectedSketchVertex=-1;return true;}
function rectangleSketch(w,l){if(!Number.isFinite(w)||!Number.isFinite(l)||w<=0||l<=0)throw Error('Ancho y largo deben ser positivos');return [[0,0],[w,0],[w,l],[0,l]];}
function circleSketch(diameter,segments=48){
 if(!Number.isFinite(diameter)||diameter<=0||!Number.isInteger(segments)||segments<12||segments>128)throw Error('Diámetro o resolución no válidos');
 const r=diameter/2;
 return Array.from({length:segments},(_,i)=>[Math.cos(i*Math.PI*2/segments)*r,Math.sin(i*Math.PI*2/segments)*r]);
}
function removeSketchVertex(index){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length)return false;
 pushSketchHistory();sketchPoints.splice(index,1);selectedSketchVertex=-1;return true;
}
function snapSketchPoint(x,y){return sketchSnapping?[Math.round(x/sketchStep)*sketchStep,Math.round(y/sketchStep)*sketchStep]:[x,y];}
function moveSketchVertex(index,x,y){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length||!Number.isFinite(x)||!Number.isFinite(y))throw Error('Vértice o coordenadas incorrectos');
 pushSketchHistory();sketchPoints[index]=[x,y];selectedSketchVertex=index;return true;
}
function setSketchProfile(points){
 const candidate=points.map(p=>[Number(p[0]),Number(p[1])]);
 const next=extrude(candidate,number('height')); // validate BEFORE changing the live model
 poly=candidate;height=number('height');model=next;profileFromDXF=true;
 fit();setStatus('Perfil 2D extruido · '+candidate.length+' vértices');
 return next;
}
function openSketch(){
 sketchPoints=cloneSketch(poly);sketchActive=true;sketchHistory=[];sketchRedoHistory=[];selectedSketchVertex=-1;sketchDragId=null;
 const panel=document.getElementById('sketchPanel');panel.classList.add('open');
 const sc=document.getElementById('sketchCanvas');
 if(!sc.dataset.ready){
  sc.addEventListener('pointerdown',e=>{
   if(!sketchActive)return;
   const rect=sc.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
   let nearest=-1,best=15;
   for(let i=0;i<sketchPoints.length;i++){
    const p=sketchPoints[i],dist=Math.hypot(rect.width/2+p[0]*sketchScale-x,rect.height/2-p[1]*sketchScale-y);
    if(dist<best){nearest=i;best=dist;}
   }
   if(nearest>=0){selectedSketchVertex=nearest;sketchDragId=e.pointerId;sketchDragRecorded=false;}
   else {
    if(sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Límite de vértices';return;}
    pushSketchHistory();sketchPoints.push(snapSketchPoint((x-rect.width/2)/sketchScale,(rect.height/2-y)/sketchScale));
    selectedSketchVertex=sketchPoints.length-1;sketchDragId=null;
   }
   if(sc.setPointerCapture)sc.setPointerCapture(e.pointerId);
   drawSketch();
  });
  sc.addEventListener('pointermove',e=>{
   if(!sketchActive||e.pointerId!==sketchDragId||selectedSketchVertex<0)return;
   const rect=sc.getBoundingClientRect(),p=snapSketchPoint((e.clientX-rect.left-rect.width/2)/sketchScale,(rect.height/2-(e.clientY-rect.top))/sketchScale);
   const old=sketchPoints[selectedSketchVertex];
   if(old[0]===p[0]&&old[1]===p[1])return;
   if(!sketchDragRecorded){pushSketchHistory();sketchDragRecorded=true;}
   sketchPoints[selectedSketchVertex]=p;drawSketch();
  });
  for(const event of ['pointerup','pointercancel'])sc.addEventListener(event,e=>{if(e.pointerId===sketchDragId)sketchDragId=null;});
  sc.dataset.ready='1';
 }
 requestAnimationFrame(drawSketch);
}
function drawSketch(){
 const sc=document.getElementById('sketchCanvas');if(!sc)return;
 const d=window.devicePixelRatio||1,r=sc.getBoundingClientRect();
 sc.width=Math.max(1,Math.round(r.width*d));sc.height=Math.max(1,Math.round(r.height*d));
 const c=sc.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const w=r.width,h=r.height; c.fillStyle='#14202e';c.fillRect(0,0,w,h);
 c.lineWidth=1;c.strokeStyle='#304052';
 const step=sketchStep*sketchScale;
 for(let x=w/2%step;x<w;x+=step){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}
 for(let y=h/2%step;y<h;y+=step){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
 const to=p=>[w/2+p[0]*sketchScale,h/2-p[1]*sketchScale];
 c.strokeStyle='#73d2ec';c.lineWidth=2;c.beginPath();
 sketchPoints.forEach((p,i)=>{const q=to(p);if(i===0)c.moveTo(...q);else c.lineTo(...q);});
 if(sketchPoints.length>=3)c.lineTo(...to(sketchPoints[0]));c.stroke();
 sketchPoints.forEach((p,i)=>{const q=to(p);c.beginPath();c.arc(...q,i===selectedSketchVertex?7:4,0,Math.PI*2);c.fillStyle=i===selectedSketchVertex?'#ff936c':'#fbc86c';c.fill();});
 if(selectedSketchVertex>=0&&sketchPoints[selectedSketchVertex]){
  document.getElementById('sketchX').value=String(sketchPoints[selectedSketchVertex][0]);
  document.getElementById('sketchY').value=String(sketchPoints[selectedSketchVertex][1]);
 }
 document.getElementById('sketchInfo').textContent=sketchPoints.length+' vértices · toca un punto y arrastra para editar · cuadrícula '+(sketchSnapping?'5 mm':'libre');
}
function addPrecisePoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 if(!sketchActive||!Number.isFinite(x)||!Number.isFinite(y)||sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Coordenadas XY no válidas o límite alcanzado';return false;}
 pushSketchHistory();sketchPoints.push([x,y]);selectedSketchVertex=sketchPoints.length-1;drawSketch();return true;
}
function updateSelectedPoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 try{if(!sketchActive)throw Error('Abre el editor');moveSketchVertex(selectedSketchVertex,x,y);drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeRectangleSketch(){
 try{const p=rectangleSketch(number('width'),number('length'));pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeCircleSketch(){
 try{
  const p=circleSketch(Number(document.getElementById('sketchDiameter').value));
  pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;
 }catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function deleteSelectedVertex(){
 if(!removeSketchVertex(selectedSketchVertex))return false;
 drawSketch();return true;
}
function toggleSketchSnap(){sketchSnapping=!sketchSnapping;document.getElementById('sketchSnapButton').textContent=sketchSnapping?'Rejilla ON':'Rejilla OFF';drawSketch();}
function undoSketch(){if(undoSketchState())drawSketch();}
function redoSketch(){if(redoSketchState())drawSketch();}
function clearSketch(){pushSketchHistory();sketchPoints=[];selectedSketchVertex=-1;drawSketch();}
function closeSketch(){sketchActive=false;sketchDragId=null;document.getElementById('sketchPanel').classList.remove('open');}
function finishSketch(){
 try{setSketchProfile(sketchPoints);closeSketch();}
 catch(e){document.getElementById('sketchInfo').textContent='Error: '+e.message;}
}

window.addEventListener('resize',resize);extrudeForm();resize();fit();receive2dHandoff();
</script></body></html>

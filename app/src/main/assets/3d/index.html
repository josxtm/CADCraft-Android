<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let poly=[[0,0],[100,0],[100,60],[0,60]], height=25, az=-0.75, el=0.5, zoom=2.6, cameraCenter=null;
let model=null,profileFromDXF=false,sourceHandle=null,faceMode=false,selectedFace=-1;
let storedSolids=[],activeSolidId=1,nextSolidId=2,activeOffset=[0,0,0];
let derivedSolids=[],selectedDerivedId=null,derivedUndo=[],derivedRedo=[],faceDragMode=false,faceGesture=null,geometryMode=null,selectedGeometryFeature=null; const status=document.getElementById('status');
let toolsVisible=true;
const recoveryKey='cadcraft.android.3d.recovery.v1';
let recoveryEnabled=false,recoveryTimer=null,recoveryLastSaved=null;
function toggleTools(){
 toolsVisible=!toolsVisible;
 const panel=document.getElementById('toolsPanel'),button=document.getElementById('toolsToggle');
 if(panel)panel.classList.toggle('collapsed',!toolsVisible);
 if(button)button.textContent=toolsVisible?'Panel: ON':'Panel: OFF';

}
function number(id){return Number(document.getElementById(id).value);}
function setStatus(t){status.textContent=t;queueRecoverySave();}
function validate(p,h){if(p.length<3||!p.every(q=>q.every(Number.isFinite))||!Number.isFinite(h)||Math.abs(h)<1e-8)throw Error('Perfil o altura no válidos');}
function cross2(a,b,c){return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);}
function inside(p,a,b,c){return cross2(a,b,p)>=-1e-8&&cross2(b,c,p)>=-1e-8&&cross2(c,a,p)>=-1e-8;}
/* A straight edge may have intermediate sketch points. Keep the source
 * sketch untouched, but remove exactly collinear forward-going points from
 * the triangulated contour so caps and walls contain no degenerate faces.
 * Backtracking overlaps are invalid, not a license to erase geometry. */
function stripStraightVertices(points){
 const p=points.map(q=>q.slice());let i=0;
 while(p.length>3&&i<p.length){
  const n=p.length,a=p[(i+n-1)%n],b=p[i],c=p[(i+1)%n];
  if(cross2(a,b,c)===0){
   const forward=(b[0]-a[0])*(c[0]-b[0])+(b[1]-a[1])*(c[1]-b[1]);
   if(forward<0)throw Error('Perfil con aristas superpuestas');
   if(forward>0){p.splice(i,1);i=Math.max(0,i-1);continue;}
  }
  i++;
 }

}
function triangulate(points){
 // Compute area relative to the first point to prevent cancellation of
 // large absolute CAD drawing coordinates (e.g. a 10 mm profile at 90 km).
 const p=stripStraightVertices(points),area=polygonSignedArea(p);
 if(Math.abs(area)<5e-10)throw Error('Área cero');if(area<0)p.reverse();
 // Reject self-intersecting profiles instead of producing invalid exported solids.
 function seg(a,b,c,d){
   const cr=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
   const o=[cr(a,b,c),cr(a,b,d),cr(c,d,a),cr(c,d,b)];
   const on=(p,q,r)=>r[0]>=Math.min(p[0],q[0])-1e-9&&r[0]<=Math.max(p[0],q[0])+1e-9&&r[1]>=Math.min(p[1],q[1])-1e-9&&r[1]<=Math.max(p[1],q[1])+1e-9;
   return (o[0]*o[1]<0&&o[2]*o[3]<0)||(Math.abs(o[0])<1e-9&&on(a,b,c))||(Math.abs(o[1])<1e-9&&on(a,b,d))||(Math.abs(o[2])<1e-9&&on(c,d,a))||(Math.abs(o[3])<1e-9&&on(c,d,b));
 }
 for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
   if((i+1)%p.length===j||(j+1)%p.length===i)continue;
   if(seg(p[i],p[(i+1)%p.length],p[j],p[(j+1)%p.length]))throw Error('El perfil se cruza consigo mismo');
 }
 const ids=p.map((_,i)=>i),tri=[];let guard=0;
 while(ids.length>3&&guard++<p.length*p.length){let found=false;for(let k=0;k<ids.length;k++){
 const a=ids[(k+ids.length-1)%ids.length],b=ids[k],c=ids[(k+1)%ids.length];
 if(cross2(p[a],p[b],p[c])<=1e-9)continue;
 if(ids.some(v=>v!==a&&v!==b&&v!==c&&inside(p[v],p[a],p[b],p[c])))continue;
 tri.push([a,b,c]);ids.splice(k,1);found=true;break;
 }if(!found)throw Error('Perfil no válido o autointersección');}
 if(ids.length!==3)throw Error('No se pudo triangular');tri.push(ids.slice());return {p,tri};
}
function extrude(points,h){
 validate(points,h);let clean=points.filter((a,i)=>i===0||Math.hypot(a[0]-points[i-1][0],a[1]-points[i-1][1])>1e-8);
 if(clean.length>1&&Math.hypot(clean[0][0]-clean.at(-1)[0],clean[0][1]-clean.at(-1)[1])<1e-8)clean.pop();
 const {p,tri}=triangulate(clean),n=p.length,v=[...p.map(a=>[...a,0]),...p.map(a=>[...a,h])],faces=[];
 for(const t of tri){if(h>0){faces.push([t[2],t[1],t[0]],[t[0]+n,t[1]+n,t[2]+n]);}else{faces.push(t,[t[2]+n,t[1]+n,t[0]+n]);}}
 for(let i=0;i<n;i++){const j=(i+1)%n;if(h>0)faces.push([i,j,j+n],[i,j+n,i+n]);else faces.push([j+n,j,i],[i+n,j+n,i]);}

function offsetMesh(mesh, offset){

function captureActiveSolid(){
 if(!model)throw Error('No hay pieza activa');

}
function restoreActiveSolid(record){
 activeSolidId=record.id;poly=record.profile.map(p=>p.slice());height=record.height;

}
function validateOffset(value){
 if(!Array.isArray(value)||value.length!==3||!value.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e8))throw Error('Desplazamiento 3D no válido');

/* Translation leaves topology unchanged mathematically, but it can push
 * vertices outside supported world coordinates or lose precision at large
 * offsets. The cheap check is safe during pointermove; deep validation is
 * performed on committed moves, including the end of a touch gesture. */
function validateWorldPlacement(mesh,offset,deep=false){
 const next=validateOffset(offset);
 if(!mesh||!Array.isArray(mesh.v)||!mesh.v.length)throw Error('Malla de pieza no válida');
 for(const p of mesh.v){
  if(!Array.isArray(p)||p.length!==3||
     p.some((v,i)=>typeof v!=='number'||!Number.isFinite(v+next[i])||Math.abs(v+next[i])>1e8))
   throw Error('Pieza fuera de límites 3D (±100 millones mm)');
 }

function createSceneSolid(){
 if(!model||storedSolids.length+derivedSolids.length>=23){setStatus('Límite de 24 piezas');return false;}
 try{
  // Prepare every failure-prone element before changing the live scene.
  if(!Number.isSafeInteger(nextSolidId)||nextSolidId<1)throw Error('ID de pieza no válido');
  const newProfile=[[0,0],[100,0],[100,60],[0,60]];
  const next=extrude(newProfile,25);
  const farthestX=Math.max(...allSceneMeshes().flatMap(item=>item.v.map(p=>p[0])));
  const candidateOffset=validateWorldPlacement(next,[farthestX+20,0,0],true);
  const previous=captureActiveSolid();
  storedSolids.push(previous);invalidateSceneContacts();
  activeSolidId=nextSolidId++;selectedDerivedId=null;activeOffset=candidateOffset;
  poly=newProfile;height=25;model=next;sourceHandle=null;profileFromDXF=true;selectedFace=-1;
  document.getElementById('height').value='25';syncOffsetFields();
  fit();setStatus('Nueva pieza '+activeSolidId+' · '+(storedSolids.length+1)+' en escena');return true;
 }catch(e){setStatus('Nueva pieza: '+e.message);return false;}
}
function duplicateSceneSolid(){
 if(selectedDerived()){setStatus('Para duplicar una malla usa Duplicar resultado');return false;}
 if(!model||storedSolids.length+derivedSolids.length>=23){setStatus('Límite de 24 piezas');return false;}
 try{
  if(!Number.isSafeInteger(nextSolidId)||nextSolidId<1)throw Error('ID de pieza no válido');
  const xs=model.v.map(p=>p[0]),width=Math.max(...xs)-Math.min(...xs);
  const copy=captureActiveSolid();
  const mesh=extrude(copy.profile,copy.height);
  const offset=validateWorldPlacement(mesh,[activeOffset[0]+width+20,activeOffset[1],activeOffset[2]],true);
  copy.id=nextSolidId;copy.offset=offset;copy.mesh=mesh;
  storedSolids.push(copy);nextSolidId++;
  selectedDerivedId=null;syncOffsetFields();invalidateSceneContacts();
  fit();setStatus('Duplicada como pieza '+copy.id);return true;
 }catch(e){setStatus('Duplicar: '+e.message);return false;}
}
function cycleSceneSolid(){
 if(selectedDerivedId)selectedDerivedId=null;
 if(!storedSolids.length)return false;

 const next=storedSolids.shift();storedSolids.push(current);
 restoreActiveSolid(next);selectedDerivedId=null;invalidateSceneContacts();fit();setStatus('Pieza activa '+activeSolidId);return true;
}
function dependentBooleanIds(sourceId){
 return derivedSolids.filter(item=>item.parents.includes(sourceId)).map(item=>item.id);
}
function deleteSceneSolid(){
 if(selectedDerived()){setStatus('Pulsa Eliminar resultado para borrar la malla booleana');return false;}
 if(!storedSolids.length){setStatus('Debe quedar al menos una pieza');return false;}
 // Do not create orphaned boolean results by deleting their extrusion.
 // This is a read-only check: all scene state and undo stacks stay intact.
 const usedBy=dependentBooleanIds(activeSolidId);

  setStatus('Pieza '+activeSolidId+' usada por resultado(s) '+usedBy.join(', ')+
   ' · elimina primero esos resultados');
  return false;
 }
 const next=storedSolids.pop();moveHistory=[];moveRedoHistory=[];restoreActiveSolid(next);selectedDerivedId=null;invalidateSceneContacts();

}
function invalidateSceneContacts(){

 if(label)label.textContent='Escena modificada · vuelve a comprobar contactos';

/* Boolean results are independent triangle-mesh objects in the scene.

function meshMeasurements(solid){

  const a=p[i],b=p[(i+1)%p.length];
  perimeter+=Math.hypot(b[0]-a[0],b[1]-a[1]);

}

/* Export must never silently deliver a broken individual solid.
 * Check each body independently; overlapping independent design bodies
 * are allowed, unlike a single boolean result with internal crossings. */
function assertSceneExportable(){
 if(!model)throw Error('No hay modelo que exportar');
 const parts=allSceneMeshes();
 if(!parts.length)throw Error('Escena sin sólidos');
 // Derived results are snapshots. Exporting after a source changed would
 // silently deliver outdated manufacturing geometry; keep the scene until
 // the operator explicitly regenerates it, without discarding direct edits.
 for(const item of derivedSolids){
  const condition=derivedSourceStatus(item);
  if(condition==='stale')throw Error('Resultado '+item.id+' obsoleto: regenera el resultado antes de exportar');
  if(condition==='missing')throw Error('Resultado '+item.id+': falta una pieza de origen');
 }
 for(const part of parts){
  try{inspectMeshTopology(part);}
  catch(e){throw Error('Pieza '+part.id+': '+e.message);}
 }

}
/* OBJ has global vertex indices, but object boundaries preserve individual
 * design parts for downstream CAD/mesh editors. Source/derived piece IDs
 * remain stable and every face refers only to vertices of its own object. */
function sceneAsMultiObjectOBJ(parts=allSceneMeshes()){
 if(!parts.length)throw Error('Escena OBJ vacía');
 const lines=['# CADCraft Android OBJ · piezas separadas'];
 let base=0;
 for(const part of parts){
  if(!Number.isSafeInteger(part.id)||part.id<1)throw Error('ID de objeto OBJ inválido');
  if(!Array.isArray(part.v)||!Array.isArray(part.faces))throw Error('Malla OBJ inválida');
  lines.push('o CADCraft_pieza_'+part.id);
  for(const point of part.v){
   if(!Array.isArray(point)||point.length!==3||!point.every(Number.isFinite))
    throw Error('Vértice OBJ inválido en pieza '+part.id);
   lines.push('v '+point.join(' '));
  }
  for(const face of part.faces){
   if(!Array.isArray(face)||face.length!==3||
      !face.every(i=>Number.isInteger(i)&&i>=0&&i<part.v.length))
    throw Error('Cara OBJ inválida en pieza '+part.id);
   lines.push('f '+face.map(i=>i+base+1).join(' '));
  }
  base+=part.v.length;
 }

}

/* ASCII STL supports multiple individually named solid sections.
 * Keep world-space coordinates and prevent malformed triangles, while
 * the export gate separately checks watertightness of each input part. */
function sceneAsMultiSolidSTL(parts=allSceneMeshes()){
 if(!parts.length)throw Error('Escena STL vacía');
 const lines=[];
 for(const part of parts){
  if(!Number.isSafeInteger(part.id)||part.id<1)throw Error('ID de sólido STL inválido');
  if(!Array.isArray(part.v)||!Array.isArray(part.faces))throw Error('Malla STL inválida');
  const label='CADCraft_pieza_'+part.id;
  lines.push('solid '+label);
  for(const face of part.faces){
   if(!Array.isArray(face)||face.length!==3||
      !face.every(i=>Number.isInteger(i)&&i>=0&&i<part.v.length))
    throw Error('Cara STL inválida en pieza '+part.id);
   const points=face.map(i=>part.v[i]);
   if(points.some(p=>!Array.isArray(p)||p.length!==3||!p.every(Number.isFinite)))
    throw Error('Vértices STL inválidos en pieza '+part.id);
   const [a,b,c]=points,u=b.map((v,i)=>v-a[i]),v=c.map((x,i)=>x-a[i]);
   const normal=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
   const magnitude=Math.hypot(...normal);
   if(!(magnitude>1e-10))throw Error('Triángulo STL degenerado en pieza '+part.id);
   lines.push(' facet normal '+normal.map(x=>x/magnitude).join(' '),'  outer loop');
   for(const p of points)lines.push('   vertex '+p.join(' '));
   lines.push('  endloop',' endfacet');
  }
  lines.push('endsolid '+label);

}
/* C4/B6: Export only the selected source extrusion or CSG result.

  const record=recordById(id),mesh=meshById(id);
  if(!record||!mesh)throw Error('No hay pieza seleccionada');
  const derived=derivedSolids.find(item=>item.id===id);
  if(derived){
    const condition=derivedSourceStatus(derived);
    if(condition==='stale')throw Error('Resultado '+id+' obsoleto: regenera antes de exportar');
    if(condition==='missing')throw Error('Resultado '+id+': falta una pieza de origen');
  }
  const part={id,...offsetMesh(mesh,record.offset)};
  try{inspectMeshTopology(part);}
  catch(e){throw Error('Pieza '+id+': '+e.message);}
  return part;
}

function validateProjectSolid(data,id,offset){
 if(!data||!Array.isArray(data.profile)||data.profile.length<3||data.profile.length>10000)throw Error('Perfil de pieza inválido');
 if(!data.profile.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n))))throw Error('Coordenadas incorrectas');
 if(typeof data.height!=='number'||!Number.isFinite(data.height)||Math.abs(data.height)<1e-8)throw Error('Altura incorrecta');
 if(!Number.isSafeInteger(id)||id<1)throw Error('ID de pieza no válido');
 const placement=validateOffset(offset);
 const mesh=extrude(data.profile,data.height);
 // Loading and saving must enforce the same world-space topology gate as
 // 2D handoff and interactive extrusion, for every source piece.
 inspectMeshTopology(offsetMesh(mesh,placement));
 return {id,profile:data.profile.map(p=>p.slice()),height:data.height,
  sourceHandle:typeof data.sourceHandle==='string'?data.sourceHandle:null,
  offset:placement,mesh};
}
function validateProjectDerived(data){
 if(!data||!Number.isSafeInteger(data.id)||data.id<1||
    !['union','subtract','intersect'].includes(data.mode)||
    !Array.isArray(data.parents)||data.parents.length!==2||
    !data.parents.every(id=>Number.isSafeInteger(id)&&id>0))
  throw Error('Registro booleano incompatible');
 const fingerprints=data.sourceFingerprints==null?null:data.sourceFingerprints;
 if(fingerprints!==null&&(!Array.isArray(fingerprints)||fingerprints.length!==2||
     !fingerprints.every(hash=>typeof hash==='string'&&/^[0-9a-f]{8}$/.test(hash))))
  throw Error('Metadatos de procedencia no válidos');
 const mesh=validateDerivedMesh(data.mesh);
 // Reject a locally valid CSG mesh whose saved translation pushes vertices
 // beyond the same world-space limits enforced for editable source solids.
 const offset=validateWorldPlacement(mesh,data.offset,true);
 return {id:data.id,mode:data.mode,parents:data.parents.slice(),
  sourceFingerprints:fingerprints?fingerprints.slice():null,
  offset,mesh};
}
function loadProjectText(text){
 // Validate the complete candidate before touching an in-progress face edit.
 // A rejected file must not cancel a preview or alter the live scene.
 if(typeof text!=='string'||text.length>2000000)throw Error('Proyecto demasiado grande');
 const parsed=JSON.parse(text);
 if(!parsed||parsed.format!=='cadcraft-android-3d'||![1,2,3].includes(parsed.version))throw Error('Formato de proyecto no compatible');
 const legacy=parsed.version===1;
 const main=validateProjectSolid(parsed,legacy?1:parsed.activeSolidId,legacy?[0,0,0]:parsed.activeOffset);
 const others=legacy?[]:parsed.solids;
 if(!Array.isArray(others)||others.length>23)throw Error('Demasiadas piezas en el proyecto');
 const records=others.map(r=>validateProjectSolid(r,r.id,r.offset));
 const output=parsed.version===3?parsed.derivedSolids:[];
 if(!Array.isArray(output)||output.length+records.length>23)throw Error('Demasiadas piezas en el proyecto');
 const meshes=output.map(validateProjectDerived);
 const ids=[main.id,...records.map(p=>p.id),...meshes.map(p=>p.id)];
 if(new Set(ids).size!==ids.length)throw Error('ID de pieza duplicado');
 const selected=parsed.version===3&&parsed.selectedDerivedId!=null?parsed.selectedDerivedId:null;
 if(selected!=null&&!meshes.some(m=>m.id===selected))throw Error('Selección booleana no existe');
 // Only a valid replacement may cancel the old preview and replace the scene.
 if(faceGesture)finishFaceGesture(faceGesture.pointerId,true);
 storedSolids=records;derivedSolids=meshes;selectedDerivedId=selected;derivedUndo=[];derivedRedo=[];exitGeometryMode();moveHistory=[];moveRedoHistory=[];moveGesture=null;
 nextSolidId=Math.max(...ids)+1;
 restoreActiveSolid(main);syncOffsetFields();invalidateSceneContacts();
 fit();setStatus('Proyecto cargado · '+ids.length+' pieza(s)');
 return model;
}
/* Project-save gate mirrors the loader checks without modifying active
 * scene state. Unlike OBJ/STL export, stale CSG is intentionally allowed
 * here: save the editable sources before opting into regeneration. */
function verifiedProjectJSON(){
 const content=serializeProject();
 if(content.length>2000000)throw Error('El proyecto supera 2 MB; reduce la complejidad antes de guardarlo');
 const project=JSON.parse(content);
 const source=[{id:project.activeSolidId,profile:project.profile,height:project.height,
  sourceHandle:project.sourceHandle,offset:project.activeOffset},...project.solids];
 const ids=[];
 for(const item of source){
  validateProjectSolid(item,item.id,item.offset);
  ids.push(item.id);
 }
 for(const item of project.derivedSolids){
  validateProjectDerived(item);
  ids.push(item.id);
 }
 if(new Set(ids).size!==ids.length)throw Error('ID de pieza duplicado');
 if(ids.length>24)throw Error('Límite de 24 piezas');
 return content;
}
/* C3: transactional local recovery for the Android WebView's DOM storage.
 * Store only a fully validated v3 JSON document. setItem is atomic; a failed
 * validation, quota error, or disabled storage never destroys the last copy.
 * Edits are debounced, while backgrounding/navigation flush synchronously.
 * No camera or temporary pointer gesture is persisted in the project file. */
function recoveryStorage(){
 try{return typeof localStorage!=='undefined'?localStorage:null;}
 catch(e){return null;}
}
function saveRecoverySnapshot(){
 const storage=recoveryStorage();
 if(!storage)return false;
 try{
  const content=verifiedProjectJSON();
  if(content===recoveryLastSaved)return true;
  storage.setItem(recoveryKey,content);
  recoveryLastSaved=content;
  return true;
 }catch(e){return false;}
}
function queueRecoverySave(){
 if(!recoveryEnabled)return;
 if(recoveryTimer!==null)clearTimeout(recoveryTimer);
 recoveryTimer=setTimeout(()=>{recoveryTimer=null;saveRecoverySnapshot();},1200);
}
function restoreRecoverySnapshot(){
 const storage=recoveryStorage();
 if(!storage)return false;
 try{
  const raw=storage.getItem(recoveryKey);
  if(!raw)return false;
  // The existing loader validates the entire candidate before touching any
  // scene state. Invalid recovery bytes are retained for manual diagnosis.
  loadProjectText(raw);
  recoveryLastSaved=raw;
  setStatus('Sesión 3D recuperada desde copia local validada');
  return true;
 }catch(e){
  setStatus('Recuperación rechazada: '+e.message);
  return false;
 }
}
function discardRecoverySnapshot(){
 const storage=recoveryStorage();
 if(!storage)return false;
 if(typeof window.confirm==='function'&&!window.confirm('¿Borrar la copia local de recuperación 3D?'))return false;
 try{
  // Mark the current state as already handled: the status update must not
  // immediately recreate the just-deleted backup. The next edit will save.
  const current=verifiedProjectJSON();
  storage.removeItem(recoveryKey);
  recoveryLastSaved=current;
  setStatus('Copia local eliminada; los próximos cambios se guardarán');
  return true;
 }catch(e){setStatus('Borrar copia local: '+e.message);return false;}
}
window.addEventListener('pagehide',()=>{if(recoveryEnabled)saveRecoverySnapshot();});
document.addEventListener('visibilitychange',()=>{
 if(recoveryEnabled&&document.visibilityState==='hidden')saveRecoverySnapshot();
});
function saveProject(){
 try{
  const content=verifiedProjectJSON();
  const blob=new Blob([content],{type:'application/json'});
  const a=document.createElement('a');a.download='CADCraft_proyecto.json';
  a.href=URL.createObjectURL(blob);a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),30000);
  // Android WebView may ignore blob downloads without a native download bridge.
  // Keep a validated recovery copy and never claim a file was saved to disk.
  const recovered=saveRecoverySnapshot();
  setStatus(recovered?'Proyecto validado · copia local conservada; comprueba la descarga JSON':'Proyecto validado · comprueba que Android haya descargado el JSON');return true;
 }catch(e){setStatus('Guardar: '+e.message);return false;}
}
function pickProject(){
 const picker=document.getElementById('projectFile');
 if(!picker){setStatus('Abrir: selector de proyectos no disponible');return false;}
 // Clear before opening so selecting the same file twice still fires change.
 picker.value='';picker.click();return true;
}
document.getElementById('projectFile').addEventListener('change',async e=>{
 const picker=e.target;
 const file=picker.files&&picker.files[0];
 if(!file)return;
 try{
  if(file.size>2000000)throw Error('Proyecto demasiado grande');
  if(!/\\.json$/i.test(file.name))throw Error('Selecciona un proyecto JSON');
  loadProjectText(await file.text());
 }catch(err){setStatus('Proyecto: '+err.message);}
 finally{picker.value='';}
});

/* DXF LWPOLYLINE import is intentionally single-loop. Treating the
 * first loop of a multi-loop sketch as a solid silently loses holes/islands,
 * so refuse ambiguous profiles until true multi-loop extrusion exists. */

/* C4: DXF $INSUNITS is defined in the HEADER section. Never silently
 * reinterpret an inch/foot/metre drawing as millimetres. Legacy CADCraft
 * handoffs without HEADER retain their established millimetre assumption.
 * Other unit codes are rejected rather than guessed. */
function dxfMillimetreScale(pairs){
 let section=null,scale=1,declared=false;
 const scales={0:1,1:25.4,2:304.8,4:1,5:10,6:1000,14:100};
 for(let i=0;i<pairs.length;i++){
  const [code,value]=pairs[i];
  if(code==='0'&&value==='SECTION'){
   if(!pairs[i+1]||pairs[i+1][0]!=='2')throw Error('Sección DXF incompleta');
   section=pairs[++i][1];continue;
  }
  if(code==='0'&&value==='ENDSEC'){section=null;continue;}
  if(section!=='HEADER'||code!=='9'||value!=='$INSUNITS')continue;
  if(declared)throw Error('DXF con unidades declaradas varias veces');
  declared=true;
  const unit=pairs[i+1];
  if(!unit||unit[0]!=='70'||!/^\d+$/.test(unit[1]))throw Error('DXF con $INSUNITS inválido');
  const id=Number(unit[1]);
  if(!Object.prototype.hasOwnProperty.call(scales,id))
   throw Error('Unidades DXF no compatibles ($INSUNITS='+id+')');
  scale=scales[id];
 }
 return scale;
}
/* C4/A5: A DXF BLOCKS definition is not a visible model-space profile.
 * Accept the legacy sectionless CADCraft handoff, but when SECTION records
 * exist only the ENTITIES section can supply an extrudable contour.
 * Validate the section framing before touching the current 3D project. */
function dxfEntityIndices(pairs){
 let section=null,structured=false,entitiesSeen=false;
 // Old CADCraft handoffs contain an unpaired ENDSEC but no SECTION.
 // Preserve those fixtures while rejecting orphan ENDSEC in structured DXF.
 const hasSections=pairs.some(([c,v])=>c==='0'&&v==='SECTION');
 const candidates=[];
 for(let i=0;i<pairs.length;i++){
  const [code,value]=pairs[i];
  if(code!=='0')continue;
  if(value==='SECTION'){
   if(section!==null)throw Error('DXF con secciones anidadas');
   const header=pairs[++i];
   if(!header||header[0]!=='2'||!header[1])throw Error('Sección DXF incompleta');
   section=header[1];structured=true;
   if(section==='ENTITIES'){
    if(entitiesSeen)throw Error('DXF con sección ENTITIES duplicada');
    entitiesSeen=true;
   }
  }else if(value==='ENDSEC'){
   if(section===null){
    if(hasSections)throw Error('DXF con ENDSEC sin SECTION');
    continue;
   }
   section=null;
  }else if(value==='EOF'){
   if(section!==null)throw Error('DXF con sección sin cerrar');
   if(pairs.slice(i+1).some(([c,v])=>c==='0'&&v==='SECTION'))
    throw Error('DXF con datos tras EOF');
   break;
  }else if(value==='LWPOLYLINE'||value==='CIRCLE'||value==='ELLIPSE'||value==='POLYLINE'){
   candidates.push({index:i,section});
  }
 }
 if(section!==null)throw Error('DXF con sección sin cerrar');
 if(structured&&!entitiesSeen)throw Error('DXF sin sección ENTITIES');
 return candidates.filter(item=>!structured||item.section==='ENTITIES').map(item=>item.index);
}
/* C4: LWPOLYLINE bulge is tan(sweep/4) for the segment starting at
 * that vertex (including the closing segment). Approximate arcs in mm so
 * INSUNITS is honoured and chord error is bounded in physical units.
 * This produces a tessellated mesh, NOT an analytic circular B-Rep edge. */
function expandDxfBulgeProfile(points,bulges,unitScale){
 if(points.length!==bulges.length||points.length<2)throw Error('Vértices DXF inválidos');
 const mm=points.map(p=>p.map(v=>v*unitScale));
 if(mm.some(p=>p.some(v=>!Number.isFinite(v))))
  throw Error('Coordenadas DXF fuera del rango numérico');
 const expanded=[];
 for(let i=0;i<mm.length;i++){
  const a=mm[i],b=mm[(i+1)%mm.length],bulge=bulges[i];
  if(!Number.isFinite(bulge)||Math.abs(bulge)>1000)
   throw Error('Arco DXF bulge fuera de rango');
  expanded.push(a.slice());
  if(bulge===0)continue;
  const dx=b[0]-a[0],dy=b[1]-a[1],chord=Math.hypot(dx,dy);
  if(!Number.isFinite(chord)||chord<1e-8||chord*Math.abs(bulge)/2<1e-7)
   throw Error('Arco DXF bulge demasiado pequeño o degenerado');

  const radius=chord*(1+bulge*bulge)/(4*Math.abs(bulge));
  if(!Number.isFinite(radius)||radius<=0)throw Error('Radio DXF bulge inválido');
  // Max chord deviation: 0.05 mm for small arcs, at most 0.5 mm for
  // very large radii; never silently exceed the segment safety limit.
  const tolerance=Math.min(0.5,Math.max(0.05,radius*1e-4));
  const angle=2*Math.acos(1-Math.min(1,tolerance/radius));
  const segments=Math.max(2,Math.ceil(Math.abs(theta)/angle));
  if(!Number.isFinite(segments)||segments>2048||expanded.length+segments>2048)
   throw Error('Arco DXF demasiado complejo: reduce su tamaño o tolerancia');

  const cx=a[0]/2+b[0]/2-dy*k,cy=a[1]/2+b[1]/2+dx*k;
  const sx=a[0]-cx,sy=a[1]-cy;
  for(let step=1;step<segments;step++){
   const t=theta*step/segments,c=Math.cos(t),s=Math.sin(t);
   const vertex=[cx+sx*c-sy*s,cy+sx*s+sy*c];
   if(vertex.some(v=>!Number.isFinite(v)))
    throw Error('Arco DXF fuera del rango numérico');
   expanded.push(vertex);

  throw Error('Perfil DXF sin área o demasiado complejo');

}
/* Native DXF CIRCLE profiles are closed by definition. Approximate with
 * the same physical chord-error policy as bulge arcs. Reject unsupported
 * huge circles instead of silently truncating a manufacturing profile. */
function expandDxfCircleProfile(cx,cy,r,unitScale){

    radius<=1e-7)throw Error('CIRCLE DXF con centro o radio inválido');
 const tolerance=Math.min(0.5,Math.max(0.05,radius*1e-4));
 const angle=2*Math.acos(1-Math.min(1,tolerance/radius));
 const segments=Math.max(12,Math.ceil(2*Math.PI/angle));
 if(!Number.isFinite(segments)||segments>2048)
  throw Error('CIRCLE DXF demasiado complejo: reduce su tamaño o tolerancia');

  const a=2*Math.PI*i/segments;
  return [center[0]+radius*Math.cos(a),center[1]+radius*Math.sin(a)];

}
/* A DXF ELLIPSE has a major-axis vector (11,21), a minor/major
 * radius ratio (40), and start/end parameters (41,42). Only complete
 * ellipses represent closed single-outline sketches; elliptical arcs are
 * intentionally rejected rather than silently inventing a closing chord.
 * The parameter-step bound applies physical-mm chord error to any rotation.

function expandDxfEllipseProfile(cx,cy,dx,dy,ratio,unitScale){

    majorRadius<=1e-7||minorRadius<=1e-7||
    !Number.isFinite(ratio)||ratio<=0||ratio>1)
  throw Error('ELLIPSE DXF con ejes o razón no válidos');
 const tolerance=Math.min(0.5,Math.max(0.05,majorRadius*1e-4));
 const angle=2*Math.acos(1-Math.min(1,tolerance/majorRadius));
 const segments=Math.max(12,Math.ceil(2*Math.PI/angle));
 if(!Number.isFinite(segments)||segments>2048)
  throw Error('ELLIPSE DXF demasiado compleja: reduce su tamaño o tolerancia');

  const theta=2*Math.PI*i/segments,c=Math.cos(theta),sn=Math.sin(theta);
  return [center[0]+major[0]*c-major[1]*ratio*sn,
          center[1]+major[1]*c+major[0]*ratio*sn];

}
/* Legacy DXF POLYLINE stores its outline as VERTEX records terminated
 * by SEQEND. Accept only flat, closed 2D outlines; reject polyface meshes,
 * 3D polylines, nonzero widths and extrusion thickness instead of silently
 * changing manufacturing geometry. Bulge arcs share the LWPOLYLINE gate. */
function parseLegacyDxfPolyline(pairs,start,numeric,unitScale){

   if(seen.has(code))throw Error('POLYLINE DXF con cabecera duplicada: '+code);

    throw Error('POLYLINE DXF 3D, malla o ajuste de curva no compatible');

   if(numeric(value)!==1)throw Error('POLYLINE DXF sin secuencia VERTEX');

  else if(code==='20')headerY=numeric(value);

   if(numeric(value)!==0)throw Error('POLYLINE DXF con ancho o espesor no compatible');

   const space=numeric(value);

    throw Error('POLYLINE DXF con espacio 67 inválido');

  for(;i<pairs.length&&pairs[i][0]!=='0';i++){
   const [code,value]=pairs[i];
   if(['10','20','30','40','41','42','70'].includes(code)){
    if(vseen.has(code))throw Error('VERTEX DXF con parámetro duplicado: '+code);
    vseen.add(code);
   }
   if(code==='10')x=numeric(value);
   else if(code==='20')y=numeric(value);
   else if(code==='30')z=numeric(value);
   else if(code==='42')bulge=numeric(value);
   else if(code==='40'||code==='41'){
    if(numeric(value)!==0)throw Error('VERTEX DXF con anchura no compatible');
   }else if(code==='70'){

     throw Error('VERTEX DXF 3D, spline o malla no compatible');
   }
  }
  if(x===null||y===null||z!==0)throw Error('VERTEX DXF con coordenadas 2D incompletas');

 if(!closed)return {points:null,end:i};

    normal.some((n,k)=>Math.abs(n-[0,0,1][k])>1e-12))
  throw Error('POLYLINE DXF fuera del plano XY');

function parseDxfProfile(text){
 if(typeof text!=='string'||text.length>2000000)throw Error('DXF demasiado grande');
 const lines=text.replace(/\r/g,'').split('\n'),pairs=[];
 if(lines.length>200001)throw Error('DXF con demasiados registros');
 for(let i=0;i<lines.length-1;i+=2)pairs.push([lines[i].trim(),lines[i+1].trim()]);
 const entityIndices=new Set(dxfEntityIndices(pairs));
 const unitScale=dxfMillimetreScale(pairs);
 const profiles=[];
 const numeric=value=>{
  if(value===''||!Number.isFinite(Number(value)))throw Error('Coordenada o parámetro DXF inválido');
  return Number(value);

 for(let i=0;i<pairs.length;i++){
  if(!entityIndices.has(i))continue;
  const entityType=pairs[i][1];
  if(entityType==='POLYLINE'){
   const parsed=parseLegacyDxfPolyline(pairs,i,numeric,unitScale);
   i=parsed.end;
   if(parsed.points){
    profiles.push(parsed.points);
    if(profiles.length>1)
     throw Error('DXF con varios perfiles cerrados: agujeros/islas aún no compatibles');
   }
   continue;
  }
  if(entityType==='ELLIPSE'){
   let cx=null,cy=null,cz=0,dx=null,dy=null,dz=0,ratio=null;
   let start=0,end=2*Math.PI,layout=null,paperSpace=false;
   const normal=[0,0,1],seen=new Set();
   for(i++;i<pairs.length&&pairs[i][0]!=='0';i++){
    const [code,value]=pairs[i];
    if(['10','20','30','11','21','31','40','41','42','67','410','210','220','230'].includes(code)){
     if(seen.has(code))throw Error('Parámetro ELLIPSE DXF duplicado: '+code);
     seen.add(code);
    }
    if(code==='10')cx=numeric(value);
    else if(code==='20')cy=numeric(value);
    else if(code==='30')cz=numeric(value);
    else if(code==='11')dx=numeric(value);
    else if(code==='21')dy=numeric(value);
    else if(code==='31')dz=numeric(value);
    else if(code==='40')ratio=numeric(value);
    else if(code==='41')start=numeric(value);
    else if(code==='42')end=numeric(value);
    else if(code==='67'){
     const space=numeric(value);
     if(!Number.isInteger(space)||![0,1].includes(space))
      throw Error('Espacio ELLIPSE DXF (67) inválido');
     paperSpace=space===1;
    }else if(code==='410')layout=value;
    else if(code==='210')normal[0]=numeric(value);
    else if(code==='220')normal[1]=numeric(value);
    else if(code==='230')normal[2]=numeric(value);
   }
   i--;
   if(paperSpace||(layout!==null&&layout!=='Model'))continue;
   if(cx===null||cy===null||dx===null||dy===null||ratio===null)
    throw Error('ELLIPSE DXF sin centro, eje mayor o razón');
   if(cz!==0||dz!==0||normal.some((n,k)=>Math.abs(n-[0,0,1][k])>1e-12))
    throw Error('ELLIPSE DXF fuera del plano XY');
   if(Math.abs(start)>1e-7||Math.abs(end-2*Math.PI)>1e-6)
    throw Error('ELLIPSE DXF parcial: solo elipses completas cerradas');
   profiles.push(expandDxfEllipseProfile(cx,cy,dx,dy,ratio,unitScale));
   if(profiles.length>1)throw Error('DXF con varios perfiles cerrados: agujeros/islas aún no compatibles');
   continue;
  }
  if(entityType==='CIRCLE'){
   let cx=null,cy=null,cz=0,r=null,thickness=0,layout=null,paperSpace=false;
   const normal=[0,0,1],seen=new Set();
   for(i++;i<pairs.length&&pairs[i][0]!=='0';i++){
    const [code,value]=pairs[i];
    if(['10','20','30','40','39','67','410','210','220','230'].includes(code)){
     if(seen.has(code))throw Error('Parámetro CIRCLE DXF duplicado: '+code);
     seen.add(code);
    }
    if(code==='10')cx=numeric(value);
    else if(code==='20')cy=numeric(value);
    else if(code==='30')cz=numeric(value);
    else if(code==='40')r=numeric(value);
    else if(code==='39')thickness=numeric(value);
    else if(code==='67'){
     const space=numeric(value);
     if(!Number.isInteger(space)||![0,1].includes(space))
      throw Error('Espacio CIRCLE DXF (67) inválido');
     paperSpace=space===1;
    }else if(code==='410')layout=value;
    else if(code==='210')normal[0]=numeric(value);
    else if(code==='220')normal[1]=numeric(value);
    else if(code==='230')normal[2]=numeric(value);
   }
   i--;
   if(paperSpace||(layout!==null&&layout!=='Model'))continue;
   if(cx===null||cy===null||r===null||r<=0)
    throw Error('CIRCLE DXF sin centro o radio positivo');
   if(cz!==0||thickness!==0||normal.some((n,k)=>Math.abs(n-[0,0,1][k])>1e-12))
    throw Error('CIRCLE DXF con elevación, espesor o plano inclinado no compatible');
   profiles.push(expandDxfCircleProfile(cx,cy,r,unitScale));
   if(profiles.length>1)throw Error('DXF con varios perfiles cerrados: agujeros/islas aún no compatibles');
   continue;
  }
  const pts=[],bulges=[],normal=[0,0,1];let closed=false,count=null,elevation=0,thickness=0;
  let bulgeSet=false,constantWidthSeen=false,vertexWidths=new Set();
  let paperSpace=false,layout=null;
  for(i++;i<pairs.length&&pairs[i][0]!=='0';i++){
   const [code,value]=pairs[i];
   if(code==='10'){
    if(pts.length>=10000)throw Error('DXF con demasiados vértices');
    pts.push([numeric(value),NaN]);bulges.push(0);bulgeSet=false;vertexWidths=new Set();
   }else if(code==='20'){
    if(!pts.length||Number.isFinite(pts[pts.length-1][1]))
     throw Error('Orden de coordenadas DXF inválido');
    pts[pts.length-1][1]=numeric(value);
   }else if(code==='70'){
    const flags=numeric(value);
    if(!Number.isInteger(flags)||flags<0)throw Error('Indicadores DXF inválidos');
    closed=(flags&1)!==0;
   }else if(code==='90'){
    count=numeric(value);
    if(!Number.isInteger(count)||count<0||count>10000)
     throw Error('Número de vértices DXF inválido');
   }else if(code==='42'){
    if(!pts.length||!Number.isFinite(pts[pts.length-1][1])||bulgeSet)
     throw Error('Orden o repetición de bulge DXF inválido');
    bulges[bulges.length-1]=numeric(value);bulgeSet=true;
   }else if(code==='43'||code==='40'||code==='41'){
    // A LWPOLYLINE can describe a visible thick strip using constant
    // width (43) or per-vertex start/end widths (40/41). Treating it as
    // a zero-width outline would silently change its manufactured shape.
    // This importer only accepts truly zero-width closed profiles.
    const width=numeric(value);
    if(width<0)throw Error('Anchura LWPOLYLINE DXF negativa');
    if(code==='43'){
     if(constantWidthSeen)throw Error('Anchura LWPOLYLINE DXF duplicada');
     constantWidthSeen=true;
    }else{
     if(!pts.length||vertexWidths.has(code))
      throw Error('Anchura LWPOLYLINE DXF sin vértice o duplicada');
     vertexWidths.add(code);
    }
    if(width!==0)throw Error('Anchura LWPOLYLINE DXF no compatible: usa contorno sin grosor');
   }else if(code==='67'){
    const space=numeric(value);
    if(!Number.isInteger(space)||![0,1].includes(space))
     throw Error('Espacio DXF (67) inválido');
    paperSpace=space===1;
   }else if(code==='410')layout=value;
   else if(code==='38')elevation=numeric(value);
   else if(code==='39')thickness=numeric(value);
   else if(code==='210')normal[0]=numeric(value);
   else if(code==='220')normal[1]=numeric(value);
   else if(code==='230')normal[2]=numeric(value);
  }
  i--;
  // Layout entities (paper space) are not mechanical profiles in the model.
  if(paperSpace||(layout!==null&&layout!=='Model'))continue;
  if(!closed)continue;
  if(count!==null&&count!==pts.length)throw Error('Cantidad de vértices DXF incoherente');
  if(pts.length<2||pts.some(p=>!p.every(Number.isFinite)))
   throw Error('Polilínea DXF cerrada con coordenadas incompletas');
  if(elevation!==0||thickness!==0||normal.some((n,k)=>Math.abs(n-[0,0,1][k])>1e-12))
   throw Error('DXF con elevación, espesor o plano inclinado no compatible');
  // Convert only after the complete entity has passed OCS, bulge and
  // vertex-count checks. The existing extrusion gate checks world limits.
  const millimetres=expandDxfBulgeProfile(pts,bulges,unitScale);
  profiles.push(millimetres);
  if(profiles.length>1)throw Error('DXF con varios perfiles cerrados: agujeros/islas aún no compatibles');
 }
 if(!profiles.length)throw Error('No hay LWPOLYLINE o POLYLINE cerrada, CIRCLE o ELLIPSE en XY');
 return profiles[0];
}
function importDxfText(text){
 const points=parseDxfProfile(text);
 setSketchProfile(points);
 setStatus('Perfil DXF importado en mm · '+points.length+' vértices');
 return model;
}
document.getElementById('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{importDxfText(await f.text());}
 catch(err){setStatus('DXF: '+err.message);}
 e.target.value='';
});
function receive2dHandoff(){
 try {
  const key='cadcraft.android.dxf.handoff';
  const data=sessionStorage.getItem(key);
  if(!data)return;
  sessionStorage.removeItem(key);
  importDxfText(data);
 }catch(e){setStatus('Transferencia 2D: '+e.message);}
}


/* C1/A5: Re-selecting a WASM source refreshes every linked 3D extrusion.
 * Validate all meshes in world coordinates before mutating any scene state. */
/* Make one independent source extrusion without altering its geometry.
 * Duplicates normally remain linked to the same WASM sketch, which is useful
 * until the operator explicitly detaches one copy. Retain all face and CSG
 * geometry, IDs, transforms and edit history; only the source association
 * changes. A later handoff still refreshes other copies with that handle. */
function detachActiveSketchSource(){
 if(selectedDerived()){
  setStatus('Vuelve a una extrusión para desvincular su boceto');return false;
 }
 if(typeof sourceHandle!=='string'||!sourceHandle){
  setStatus('Esta extrusión no está vinculada a un boceto 2D');return false;
 }
 const previousHandle=sourceHandle;
 sourceHandle=null;
 setStatus('Pieza '+activeSolidId+' desvinculada del boceto '+previousHandle+' · geometría conservada');
 return true;
}
function refreshLinkedSourceProfile(handle,points){
 if(typeof handle!=='string'||!handle)throw Error('Identificador 2D no válido');
 if(!Array.isArray(points)||points.length<3||points.length>10000||
    !points.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n))))
  throw Error('Contorno 2D no válido');
 const linked=[captureActiveSolid(),...storedSolids].filter(item=>item.sourceHandle===handle);
 if(!linked.length)return 0;
 const replacements=new Map();
 for(const item of linked){
  const outline=points.map(p=>p.slice());
  const candidate=extrude(outline,item.height);
  inspectMeshTopology(offsetMesh(candidate,item.offset));
  replacements.set(item.id,{...item,profile:outline,mesh:candidate});
 }
 const active=replacements.get(activeSolidId);
 if(active){
  poly=active.profile;height=active.height;model=active.mesh;
  profileFromDXF=true;selectedFace=-1;
 }
 storedSolids=storedSolids.map(item=>replacements.get(item.id)||item);
 invalidateSceneContacts();fit();
 return linked.length;
}

/* A one-time same-origin handoff populated from the actual selection in
   CADCraft's WASM editor (not from a manually saved DXF). */
function receiveSelectedProfile(){
 const key='cadcraft.android.profile.handoff';
 try{
  const raw=sessionStorage.getItem(key);
  if(!raw)return false;
  sessionStorage.removeItem(key);
  if(raw.length>512000)throw Error('Transferencia demasiado grande');
  const data=JSON.parse(raw);
  if(!data||data.version!==1||!Array.isArray(data.points)||data.points.length>10000)
   throw Error('Perfil 2D incompatible');
  const handle=typeof data.sourceHandle==='string'&&data.sourceHandle?data.sourceHandle:null;
  if(handle){
   const count=refreshLinkedSourceProfile(handle,data.points);
   if(count){
    setStatus('Boceto CADCraft actualizado · '+count+' extrusión(es) vinculada(s) · ID '+handle+
     (selectedDerived()?' · resultado booleano: comprobar dependencias':''));
    return true;
   }
  }
  const next=setSketchProfile(data.points);
  sourceHandle=handle;
  setStatus('Selección CADCraft extruida · '+next.outline.length+' vértices'+(sourceHandle?' · ID '+sourceHandle:''));
  return true;
 }catch(e){setStatus('Selección 2D: '+e.message);return false;}
}

/* Local planar sketch: shared outline and height with the existing extrusion model.
   This is deliberately separate from upstream CADCraft's document model. */
let sketchPoints=[],sketchActive=false,selectedSketchVertex=-1,sketchDragId=null,sketchDragRecorded=false;
let sketchHistory=[],sketchRedoHistory=[],sketchSnapping=true,sketchGridVisible=true;
let sketchPanMode=false,sketchPanGesture=null;
const sketchStep=5;
let sketchScale=2,sketchCenter=[0,0];
/* The sketch viewport is a temporary 2D camera, not part of the saved
 * solid geometry. Use the same transform for rendering and pointer edits,
 * or imported drawings outside the origin become impossible to manipulate. */
function sketchWorldToScreen(point,width,height){
 return [width/2+(point[0]-sketchCenter[0])*sketchScale,
         height/2-(point[1]-sketchCenter[1])*sketchScale];
}
function sketchScreenToWorld(x,y,width,height){
 return [sketchCenter[0]+(x-width/2)/sketchScale,
         sketchCenter[1]+(height/2-y)/sketchScale];
}
function fitSketchViewport(width,height){
 if(![width,height].every(Number.isFinite)||width<=0||height<=0)
  throw Error('Área de boceto no válida');
 if(!sketchPoints.length){sketchCenter=[0,0];sketchScale=2;return sketchScale;}
 if(sketchPoints.some(p=>!Array.isArray(p)||p.length!==2||!p.every(Number.isFinite)))
  throw Error('Coordenadas del boceto no válidas');
 const min=[0,1].map(k=>Math.min(...sketchPoints.map(p=>p[k])));
 const max=[0,1].map(k=>Math.max(...sketchPoints.map(p=>p[k])));
 const bounds=max.map((v,i)=>v-min[i]);
 sketchCenter=min.map((v,i)=>v+bounds[i]/2);
 const candidate=Math.min(width*.78/Math.max(bounds[0],1),
                          height*.78/Math.max(bounds[1],1));
 sketchScale=Math.max(.005,Math.min(10000,candidate));
 return sketchScale;
}
function zoomSketchViewport(x,y,ratio,width,height){
 if(![x,y,ratio,width,height].every(Number.isFinite)||ratio<=0||
    width<=0||height<=0)throw Error('Zoom de boceto no válido');
 const before=sketchScreenToWorld(x,y,width,height);
 const next=Math.max(.005,Math.min(10000,sketchScale*ratio));
 const newCenter=[before[0]-(x-width/2)/next,
                  before[1]-(height/2-y)/next];
 if(newCenter.some(n=>!Number.isFinite(n)||Math.abs(n)>1e10))
  throw Error('Zoom de boceto fuera de límites');
 sketchScale=next;sketchCenter=newCenter;
 return sketchScale;
}
function fitSketch(){
 const sc=document.getElementById('sketchCanvas');
 if(!sketchActive||!sc)return false;
 const rect=sc.getBoundingClientRect();
 try{fitSketchViewport(rect.width,rect.height);drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function panSketchViewport(dx,dy){
 if(!Number.isFinite(dx)||!Number.isFinite(dy)||!Number.isFinite(sketchScale)||sketchScale<=0)
  throw Error('Desplazamiento 2D no válido');
 const next=[sketchCenter[0]-dx/sketchScale,sketchCenter[1]+dy/sketchScale];
 if(next.some(n=>!Number.isFinite(n)||Math.abs(n)>1e10))
  throw Error('Vista 2D fuera de límites');
 sketchCenter=next;return sketchCenter;
}
function zoomSketchByFactor(factor){
 const sc=document.getElementById('sketchCanvas');
 if(!sketchActive||!sc)return false;
 const rect=sc.getBoundingClientRect();
 try{zoomSketchViewport(rect.width/2,rect.height/2,factor,rect.width,rect.height);drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function toggleSketchPan(){
 if(!sketchActive)return false;
 sketchPanMode=!sketchPanMode;sketchPanGesture=null;sketchDragId=null;
 const btn=document.getElementById('sketchPanButton');
 if(btn)btn.textContent=sketchPanMode?'Desplazar vista: ON':'Desplazar vista: OFF';
 drawSketch();return sketchPanMode;
}
function cloneSketch(points){return points.map(p=>p.slice());}
function pushSketchHistory(){sketchHistory.push(cloneSketch(sketchPoints));if(sketchHistory.length>100)sketchHistory.shift();sketchRedoHistory=[];}
function undoSketchState(){if(!sketchHistory.length)return false;sketchRedoHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchHistory.pop();selectedSketchVertex=-1;return true;}
function redoSketchState(){if(!sketchRedoHistory.length)return false;sketchHistory.push(cloneSketch(sketchPoints));sketchPoints=sketchRedoHistory.pop();selectedSketchVertex=-1;return true;}
function rectangleSketch(w,l){if(!Number.isFinite(w)||!Number.isFinite(l)||w<=0||l<=0)throw Error('Ancho y largo deben ser positivos');return [[0,0],[w,0],[w,l],[0,l]];}
function circleSketch(diameter,segments=48){
 if(!Number.isFinite(diameter)||diameter<=0||!Number.isInteger(segments)||segments<12||segments>128)throw Error('Diámetro o resolución no válidos');
 const r=diameter/2;
 return Array.from({length:segments},(_,i)=>[Math.cos(i*Math.PI*2/segments)*r,Math.sin(i*Math.PI*2/segments)*r]);
}
function removeSketchVertex(index){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length)return false;
 pushSketchHistory();sketchPoints.splice(index,1);selectedSketchVertex=-1;return true;
}
function snapSketchPoint(x,y){return sketchSnapping?[Math.round(x/sketchStep)*sketchStep,Math.round(y/sketchStep)*sketchStep]:[x,y];}
function moveSketchVertex(index,x,y){
 if(!Number.isInteger(index)||index<0||index>=sketchPoints.length||!Number.isFinite(x)||!Number.isFinite(y))throw Error('Vértice o coordenadas incorrectos');
 pushSketchHistory();sketchPoints[index]=[x,y];selectedSketchVertex=index;return true;
}
function setSketchProfile(points){
 const candidate=points.map(p=>[Number(p[0]),Number(p[1])]);
 const next=extrude(candidate,number('height')); // validate BEFORE changing the live model
 // A closed sketch is not yet a valid solid: check the actual world-space
 // candidate (including the active offset) before changing any live state.
 inspectMeshTopology(offsetMesh(next,activeOffset));
 poly=candidate;height=number('height');model=next;profileFromDXF=true;sourceHandle=null;selectedDerivedId=null;selectedFace=-1;syncOffsetFields();invalidateSceneContacts();
 fit();setStatus('Perfil 2D extruido · '+candidate.length+' vértices');
 return next;
}
function openSketch(){
 if(selectedDerived()){setStatus('El perfil del resultado booleano no es editable; vuelve a la extrusión');return false;}
 sketchPoints=cloneSketch(poly);sketchActive=true;sketchHistory=[];sketchRedoHistory=[];selectedSketchVertex=-1;sketchDragId=null;
 const panel=document.getElementById('sketchPanel');panel.classList.add('open');
 const sc=document.getElementById('sketchCanvas');
 const initialRect=sc.getBoundingClientRect();
 if(initialRect.width>0&&initialRect.height>0)fitSketchViewport(initialRect.width,initialRect.height);
 if(!sc.dataset.ready){
  sc.addEventListener('pointerdown',e=>{
   if(!sketchActive)return;
   if(sketchPanMode){
    sketchPanGesture={pointerId:e.pointerId,x:e.clientX,y:e.clientY};
    if(sc.setPointerCapture)sc.setPointerCapture(e.pointerId);
    return;
   }
   const rect=sc.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
   let nearest=-1,best=15;
   for(let i=0;i<sketchPoints.length;i++){
    const p=sketchWorldToScreen(sketchPoints[i],rect.width,rect.height),dist=Math.hypot(p[0]-x,p[1]-y);
    if(dist<best){nearest=i;best=dist;}
   }
   if(nearest>=0){selectedSketchVertex=nearest;sketchDragId=e.pointerId;sketchDragRecorded=false;}
   else {
    if(sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Límite de vértices';return;}
    pushSketchHistory();sketchPoints.push(snapSketchPoint(...sketchScreenToWorld(x,y,rect.width,rect.height)));
    selectedSketchVertex=sketchPoints.length-1;sketchDragId=null;
   }
   if(sc.setPointerCapture)sc.setPointerCapture(e.pointerId);
   drawSketch();
  });
  sc.addEventListener('pointermove',e=>{
   if(!sketchActive)return;
   if(sketchPanMode&&sketchPanGesture&&sketchPanGesture.pointerId===e.pointerId){
    try{
     const dx=e.clientX-sketchPanGesture.x,dy=e.clientY-sketchPanGesture.y;
     panSketchViewport(dx,dy);
     sketchPanGesture.x=e.clientX;sketchPanGesture.y=e.clientY;
     drawSketch();
    }catch(err){document.getElementById('sketchInfo').textContent=err.message;}
    return;
   }
   if(e.pointerId!==sketchDragId||selectedSketchVertex<0)return;
   const rect=sc.getBoundingClientRect(),p=snapSketchPoint(...sketchScreenToWorld(e.clientX-rect.left,e.clientY-rect.top,rect.width,rect.height));
   const old=sketchPoints[selectedSketchVertex];
   if(old[0]===p[0]&&old[1]===p[1])return;
   if(!sketchDragRecorded){pushSketchHistory();sketchDragRecorded=true;}
   sketchPoints[selectedSketchVertex]=p;drawSketch();
  });
  for(const event of ['pointerup','pointercancel'])sc.addEventListener(event,e=>{
   if(e.pointerId===sketchDragId)sketchDragId=null;
   if(sketchPanGesture&&e.pointerId===sketchPanGesture.pointerId)sketchPanGesture=null;
  });
  sc.addEventListener('wheel',e=>{
   if(!sketchActive)return;
   e.preventDefault();
   const rect=sc.getBoundingClientRect();
   try{zoomSketchViewport(e.clientX-rect.left,e.clientY-rect.top,
       Math.exp(-e.deltaY*.001),rect.width,rect.height);drawSketch();}
   catch(err){document.getElementById('sketchInfo').textContent=err.message;}
  },{passive:false});
  sc.dataset.ready='1';
 }
 requestAnimationFrame(drawSketch);
}
function drawSketch(){
 const sc=document.getElementById('sketchCanvas');if(!sc)return;
 const d=window.devicePixelRatio||1,r=sc.getBoundingClientRect();
 sc.width=Math.max(1,Math.round(r.width*d));sc.height=Math.max(1,Math.round(r.height*d));
 const c=sc.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const w=r.width,h=r.height; c.fillStyle='#14202e';c.fillRect(0,0,w,h);
 c.lineWidth=1;c.strokeStyle='#304052';
 const step=sketchStep*sketchScale;
 if(sketchGridVisible&&step>=8){
  const zero=sketchWorldToScreen([0,0],w,h);
  const firstX=((zero[0]%step)+step)%step,firstY=((zero[1]%step)+step)%step;
  for(let x=firstX;x<w;x+=step){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}
  for(let y=firstY;y<h;y+=step){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
 }
 const to=p=>sketchWorldToScreen(p,w,h);
 c.strokeStyle='#73d2ec';c.lineWidth=2;c.beginPath();
 sketchPoints.forEach((p,i)=>{const q=to(p);if(i===0)c.moveTo(...q);else c.lineTo(...q);});
 if(sketchPoints.length>=3)c.lineTo(...to(sketchPoints[0]));c.stroke();
 sketchPoints.forEach((p,i)=>{const q=to(p);c.beginPath();c.arc(...q,i===selectedSketchVertex?7:4,0,Math.PI*2);c.fillStyle=i===selectedSketchVertex?'#ff936c':'#fbc86c';c.fill();});
 if(selectedSketchVertex>=0&&sketchPoints[selectedSketchVertex]){
  document.getElementById('sketchX').value=String(sketchPoints[selectedSketchVertex][0]);
  document.getElementById('sketchY').value=String(sketchPoints[selectedSketchVertex][1]);
 }
 document.getElementById('sketchInfo').textContent=sketchPoints.length+' vértices · toca y arrastra para editar · ajuste '+(sketchSnapping?'5 mm':'libre')+' · cuadrícula '+(sketchGridVisible?'visible':'oculta');
}
function addPrecisePoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 if(!sketchActive||!Number.isFinite(x)||!Number.isFinite(y)||sketchPoints.length>=10000){document.getElementById('sketchInfo').textContent='Coordenadas XY no válidas o límite alcanzado';return false;}
 pushSketchHistory();sketchPoints.push([x,y]);selectedSketchVertex=sketchPoints.length-1;drawSketch();return true;
}
function updateSelectedPoint(){
 const x=Number(document.getElementById('sketchX').value),y=Number(document.getElementById('sketchY').value);
 try{if(!sketchActive)throw Error('Abre el editor');moveSketchVertex(selectedSketchVertex,x,y);drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeRectangleSketch(){
 try{const p=rectangleSketch(number('width'),number('length'));pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;}
 catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function makeCircleSketch(){
 try{
  const p=circleSketch(Number(document.getElementById('sketchDiameter').value));
  pushSketchHistory();sketchPoints=p;selectedSketchVertex=-1;drawSketch();return true;
 }catch(e){document.getElementById('sketchInfo').textContent=e.message;return false;}
}
function deleteSelectedVertex(){
 if(!removeSketchVertex(selectedSketchVertex))return false;
 drawSketch();return true;
}
function toggleSketchSnap(){sketchSnapping=!sketchSnapping;document.getElementById('sketchSnapButton').textContent=sketchSnapping?'Ajuste 5 mm: ON':'Ajuste 5 mm: OFF';drawSketch();}
function toggleSketchGrid(){
 sketchGridVisible=!sketchGridVisible;
 document.getElementById('sketchGridButton').textContent=sketchGridVisible?'Cuadrícula: ON':'Cuadrícula: OFF';
 drawSketch();return sketchGridVisible;
}
function undoSketch(){if(undoSketchState())drawSketch();}
function redoSketch(){if(redoSketchState())drawSketch();}
function clearSketch(){pushSketchHistory();sketchPoints=[];selectedSketchVertex=-1;drawSketch();}
function closeSketch(){
 sketchActive=false;sketchDragId=null;sketchPanGesture=null;sketchPanMode=false;
 const button=document.getElementById('sketchPanButton');
 if(button)button.textContent='Desplazar vista: OFF';
 document.getElementById('sketchPanel').classList.remove('open');
}
function finishSketch(){
 try{setSketchProfile(sketchPoints);closeSketch();}
 catch(e){document.getElementById('sketchInfo').textContent='Error: '+e.message;}
}

window.addEventListener('resize',resize);extrudeForm();resize();fit();
restoreRecoverySnapshot();
if(!receiveSelectedProfile())receive2dHandoff();
recoveryEnabled=true;
</script></body></html>
